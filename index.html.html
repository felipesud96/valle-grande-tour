<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Grande Tour - Liga de Tenis Amateur</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #1a1a1a;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #f0f0f0;
      --text-muted: #888;
      --border: #333;
      --danger: #e74c3c;
      --success: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; min-height: 100vh; }
    .topbar { background: #141414; border-bottom: 1px solid #222; padding: 20px 15px; text-align: center; }
    .topbar-inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    
    /* Logo de pelota de tenis animado con fuego */
    .brand-container { display: flex; align-items: center; gap: 15px; }
    .fire-ball-wrapper { position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
    .fire-glow { position: absolute; width: 80px; height: 80px; background: radial-gradient(circle, rgba(255,100,0,0.6) 0%, rgba(255,0,0,0.2) 50%, rgba(0,0,0,0) 70%); border-radius: 50%; animation: pulseGlow 1.5s infinite alternate; }
    .tennis-ball { position: relative; width: 48px; height: 48px; z-index: 2; }
    
    @keyframes pulseGlow { 0% { transform: scale(0.9); opacity: 0.7; } 100% { transform: scale(1.15); opacity: 1; } }

    .brand-title { font-size: 1.6rem; font-weight: 900; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
    .brand-subtitle { font-size: 0.85rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

    .fund-chip { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 20px; text-align: center; margin-top: 5px; }
    .fund-amount { color: var(--gold); font-weight: bold; font-size: 1.2rem; }
    .fund-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .btn-action { background: var(--gold); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; transition: 0.2s; }
    .btn-action:hover { background: var(--gold-light); }
    .btn-secondary { background: #2a2a2a; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #333; }
    .btn-danger { background: var(--danger); color: #fff; }

    .nav-tabs { display: flex; justify-content: center; background: #111; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { padding: 12px 18px; color: var(--text-muted); background: none; border: none; font-weight: 600; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; text-transform: uppercase; font-size: 0.8rem; }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    
    .player-header { display: flex; gap: 15px; align-items: center; }
    .player-photo { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #222; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .player-alias { color: var(--gold); font-style: italic; font-size: 0.9rem; }
    
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; text-align: center; }
    .stat-box { background: #111; padding: 8px; border-radius: 6px; border: 1px solid #222; }
    .stat-val { font-weight: bold; font-size: 1.1rem; color: var(--gold); }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #222; color: var(--text); border: 1px solid var(--gold); padding: 10px 20px; border-radius: 20px; z-index: 9999; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 0.9rem; }

    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-control { width: 100%; background: #111; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-container">
        <div class="fire-ball-wrapper">
          <div class="fire-glow"></div>
          <svg class="tennis-ball" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="url(#goldGrad)" />
            <path d="M 15 30 A 40 40 0 0 0 70 85" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" />
            <path d="M 30 15 A 40 40 0 0 1 85 70" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" />
            <defs>
              <radialGradient id="goldGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fff2a8" />
                <stop offset="50%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#aa7c11" />
              </radialGradient>
            </defs>
          </svg>
        </div>
        <div>
          <div class="brand-title">Valle Grande Tour</div>
          <div class="brand-subtitle">Liga de tenis amateur</div>
        </div>
      </div>

      <div class="fund-chip">
        <div id="fundAmount" class="fund-amount">$0</div>
        <div class="fund-label">Fondo del Circuito</div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; justify-content: center;">
        <button class="btn-action btn-secondary" onclick="AceApp.openIdentityModal()">👤 <span id="identityBtnText">Identifícate o regístrate</span></button>
        <button class="btn-action btn-secondary" onclick="AceApp.toggleAdmin()"><span id="adminBtnText">🔒 Modo administrador</span></button>
      </div>
      
      <div id="adminControls" style="display:none; gap: 8px; margin-top: 5px;">
        <button class="btn-action btn-secondary" onclick="AceApp.exportData()">⬇️ Respaldo</button>
        <button class="btn-action btn-secondary" onclick="document.getElementById('importFile').click()">⬆️ Restaurar</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="AceApp.importData(event)">
      </div>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="AceApp.setTab('ranking')">Ranking</button>
    <button class="tab-btn" onclick="AceApp.setTab('players')">Jugadores</button>
    <button class="tab-btn" onclick="AceApp.setTab('tournaments')">Torneos</button>
    <button class="tab-btn" onclick="AceApp.setTab('doubles')">Dobles</button>
    <button class="tab-btn" onclick="AceApp.setTab('finance')">Finanzas</button>
    <button class="tab-btn" onclick="AceApp.setTab('hall')">Salón de la Fama</button>
  </nav>

  <main class="container" id="mainContent">
    <!-- Contenido dinámico -->
  </main>

  <div id="modalContainer"></div>

  <script>
    // Estado Global con almacenamiento LocalStorage persistente
    const STORAGE_KEY = 'valle_grande_tour_data';

    let defaultState = {
      players: [],
      tournaments: [],
      doubles: [],
      expenses: [],
      achievements: [],
      isAdmin: false,
      currentTab: 'ranking',
      myPlayerId: null
    };

    let state = { ...defaultState };

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.players = parsed.players || [];
          state.tournaments = parsed.tournaments || [];
          state.doubles = parsed.doubles || [];
          state.expenses = parsed.expenses || [];
          state.achievements = parsed.achievements || [];
        }
      } catch (e) {
        console.error("Error al cargar localStorage", e);
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          players: state.players,
          tournaments: state.tournaments,
          doubles: state.doubles,
          expenses: state.expenses,
          achievements: state.achievements
        }));
        return true;
      } catch (e) {
        console.error("Error al guardar", e);
        return false;
      }
    }

    function aceAlert(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    const AceApp = {
      init() {
        loadData();
        this.render();
      },

      setTab(tab) {
        state.currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        this.render();
      },

      toggleAdmin() {
        state.isAdmin = !state.isAdmin;
        document.getElementById('adminBtnText').innerText = state.isAdmin ? '🛠️ Admin Activo' : '🔒 Modo administrador';
        document.getElementById('adminControls').style.display = state.isAdmin ? 'flex' : 'none';
        aceAlert(state.isAdmin ? "Modo Administrador Activado" : "Modo Administrador Desactivado");
        this.render();
      },

      exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `valle-grande-tour-backup-${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        aceAlert("Respaldo descargado con éxito");
      },

      importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            state.players = imported.players || [];
            state.tournaments = imported.tournaments || [];
            state.doubles = imported.doubles || [];
            state.expenses = imported.expenses || [];
            state.achievements = imported.achievements || [];
            saveData();
            aceAlert("¡Datos restaurados con éxito!");
            this.render();
          } catch (err) {
            aceAlert("Error al leer el archivo de respaldo");
          }
        };
        reader.readAsText(file);
      },

      render() {
        const main = document.getElementById('mainContent');
        
        // Calcular fondo del circuito
        let totalCollected = 0;
        state.tournaments.forEach(t => { if (t.paid) totalCollected += (t.paid.length * 2000); });
        let totalExpenses = state.expenses.reduce((acc, e) => acc + (Number(e.amount) || 0), 0);
        document.getElementById('fundAmount').innerText = `$${(totalCollected - totalExpenses).toLocaleString('es-CL')}`;

        if (state.currentTab === 'ranking' || state.currentTab === 'players') {
          if (state.players.length === 0) {
            main.innerHTML = `<div class="card" style="text-align:center;">
              <p>No hay jugadores registrados aún.</p>
              <button class="btn-action" style="margin-top:10px" onclick="AceApp.openPlayerModal()">+ Agregar Jugador</button>
            </div>`;
            return;
          }

          let html = state.isAdmin ? `<div style="margin-bottom:15px"><button class="btn-action" onclick="AceApp.openPlayerModal()">+ Agregar Jugador</button></div>` : '';
          
          state.players.forEach(p => {
            html += `<div class="card">
              <div class="player-header">
                ${p.photo ? `<img src="${p.photo}" class="player-photo">` : `<div class="player-photo">🎾</div>`}
                <div>
                  <h3 style="color:#fff">${p.name}</h3>
                  ${p.alias ? `<div class="player-alias">"${p.alias}"</div>` : ''}
                </div>
              </div>
              <div class="grid-stats">
                <div class="stat-box"><div class="stat-val">${p.height || '-'}m</div><div class="stat-lbl">Altura</div></div>
                <div class="stat-box"><div class="stat-val">${p.hand || '-'}</div><div class="stat-lbl">Mano</div></div>
                <div class="stat-box"><div class="stat-val">${p.backhand || '-'}</div><div class="stat-lbl">Revés</div></div>
              </div>
              ${p.bio ? `<p style="margin-top:10px; font-size:0.85rem; color:#aaa;">${p.bio}</p>` : ''}
              ${p.priorTitles ? `<p style="margin-top:5px; font-size:0.8rem; color:var(--gold);">${p.priorTitles}</p>` : ''}
            </div>`;
          });
          main.innerHTML = html;
        } else {
          main.innerHTML = `<div class="card" style="text-align:center;"><p>Sección ${state.currentTab.toUpperCase()} activa.</p></div>`;
        }
      },

      openPlayerModal() {
        const container = document.getElementById('modalContainer');
        container.innerHTML = `<div class="modal-overlay">
          <div class="modal-content">
            <h3 style="margin-bottom:15px; color:var(--gold)">Nuevo Jugador</h3>
            <div class="form-group"><label>Nombre Completo</label><input id="pName" class="form-control"></div>
            <div class="form-group"><label>Alias</label><input id="pAlias" class="form-control"></div>
            <div class="form-group"><label>Altura (m)</label><input id="pHeight" class="form-control" placeholder="1.75"></div>
            <div class="form-group"><label>Mano Hábil</label><input id="pHand" class="form-control" placeholder="Diestro / Zurdo"></div>
            <div class="form-group"><label>Revés</label><input id="pBackhand" class="form-control" placeholder="A una mano / Dos manos"></div>
            <div class="form-group"><label>Descripción / Bio</label><textarea id="pBio" class="form-control"></textarea></div>
            <div style="display:flex; gap:10px; margin-top:15px">
              <button class="btn-action" onclick="AceApp.savePlayer()">Guardar</button>
              <button class="btn-action btn-secondary" onclick="document.getElementById('modalContainer').innerHTML=''">Cancelar</button>
            </div>
          </div>
        </div>`;
      },

      savePlayer() {
        const name = document.getElementById('pName').value;
        if (!name) return aceAlert("El nombre es obligatorio");
        
        state.players.push({
          id: 'p_' + Date.now(),
          name: name,
          alias: document.getElementById('pAlias').value,
          height: document.getElementById('pHeight').value,
          hand: document.getElementById('pHand').value,
          backhand: document.getElementById('pBackhand').value,
          bio: document.getElementById('pBio').value,
          photo: null
        });

        saveData();
        document.getElementById('modalContainer').innerHTML = '';
        aceAlert("Jugador agregado");
        this.render();
      },

      openIdentityModal() {
        aceAlert("Para registrarte, activa el Modo Administrador para gestionar jugadores.");
      }
    };

    window.onload = () => AceApp.init();
  </script>
</body>
</html>
