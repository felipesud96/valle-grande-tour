async function saveBracketMatch(tid, isDoubles, rIdx, mIdx){
  const list = isDoubles ? state.doubles : state.tournaments;
  const t = list.find(x=>x.id===tid);
  const match = t.bracket[rIdx][mIdx];

  const winnerId = document.getElementById('bm-winner').value;
  if(!winnerId) { aceAlert('Por favor selecciona al ganador del partido.'); return; }

  const readSet = (aId, bId) => {
    const aEl = document.getElementById(aId);
    const bEl = document.getElementById(bId);
    if(!aEl || !bEl) return null;
    const a = aEl.value;
    const b = bEl.value;
    if(a==='' && b==='') return null;
    return [a===''?0:Number(a), b===''?0:Number(b)];
  };

  const rules = matchRulesOf(t);
  const sets = (rules.format === 'bestOf3'
    ? [readSet('bm-s1a','bm-s1b'), readSet('bm-s2a','bm-s2b'), readSet('bm-s3a','bm-s3b')]
    : [readSet('bm-s1a','bm-s1b')]
  ).filter(s => s !== null);

  const scoreLine = sets.map(s => `${s[0]}-${s[1]}`).join('   ');

  match.winner = winnerId;
  match.scoreLine = scoreLine;
  match.sets = sets;

  const pendingBm = window.AceApp._lastLiveStats;
  if (pendingBm) {
    match.liveStats = pendingBm;
    window.AceApp._lastLiveStats = null;
  }

  // Lógica de Auto-Avance o Auto-Cierre
  const nextRIdx = rIdx + 1;
  
  if (nextRIdx < t.bracket.length) {
    // AÚN QUEDAN RONDAS: Avanzar al ganador a la siguiente caja
    const nextMIdx = Math.floor(mIdx / 2);
    const nextMatch = t.bracket[nextRIdx][nextMIdx];
    
    if (mIdx % 2 === 0) {
      nextMatch.p1 = winnerId;
    } else {
      nextMatch.p2 = winnerId;
    }
    
    // Limpiar el futuro si se cambia un ganador anterior
    if(nextMatch.winner !== winnerId) {
        nextMatch.winner = null;
        nextMatch.scoreLine = '';
        nextMatch.sets = [];
    }
  } else {
    // ¡ES LA FINAL! Cerrar el torneo automáticamente y repartir puntos
    const champion = winnerId;
    const finalist = match.p1 === winnerId ? match.p2 : match.p1;
    
    t.results.champion = [champion];
    t.results.finalist = finalist && finalist !== 'null' ? [finalist] : [];
    
    // Detectar Semifinalistas (perdedores de 1 ronda atrás)
    t.results.semi = [];
    if (rIdx >= 1) {
      t.bracket[rIdx - 1].forEach(m => {
        const loser = m.winner === m.p1 ? m.p2 : m.p1;
        if (loser && loser !== 'null') t.results.semi.push(loser);
      });
    }
    
    // Detectar Cuartos de final (perdedores de 2 rondas atrás)
    t.results.quarter = [];
    if (rIdx >= 2) {
      t.bracket[rIdx - 2].forEach(m => {
        const loser = m.winner === m.p1 ? m.p2 : m.p1;
        if (loser && loser !== 'null') t.results.quarter.push(loser);
      });
    }
    
    t.status = 'completed';
    aceAlert('🏆 ¡Torneo finalizado! Puntos repartidos al ranking.');
  }

  // Guardar en Firebase
  try {
    await save(isDoubles ? 'doubles' : 'tournaments', list);
    closeModal();
    render();
  } catch(e) {
    console.error(e);
    aceAlert('Hubo un error al guardar.');
  }
}

// ---------- SINCRONIZACIÓN EN VIVO CON FIRESTORE ----------
// Cada partido que se está arbitrando en vivo se refleja en el documento
// 'shared/live_matches' (mismo patrón de acceso que el resto de la app,
// para no requerir cambios en las reglas de seguridad de Firestore) para
// que cualquier usuario conectado —incluido desde su propio perfil— pueda
// verlo actualizarse en tiempo real.
function liveMatchesDocRef(){ return db.collection('shared').doc('live_matches'); }

async function syncLiveMatchToFirestore(){
  if(!liveMatch) return;
  const payload = {
    nameA: liveMatch.nameA, nameB: liveMatch.nameB,
    participantsA: liveMatch.participantsA || [],
    participantsB: liveMatch.participantsB || [],
    ptsA: liveMatch.ptsA, ptsB: liveMatch.ptsB,
    gamesA: liveMatch.gamesA, gamesB: liveMatch.gamesB,
    setsWonA: liveMatch.setsWonA, setsWonB: liveMatch.setsWonB,
    sets: liveMatch.sets,
    rulesFormat: liveMatch.rules.format,
    rulesGamesPerSet: liveMatch.rules.gamesPerSet,
    source: liveMatch.source || null,
    updatedAt: Date.now()
  };
  try {
    await liveMatchesDocRef().set({ [liveMatch.docId]: encodeForFirestore(payload) }, { merge: true });
  } catch(e){
    console.warn('No se pudo sincronizar el marcador en vivo', e);
  }
}
async function removeLiveMatchFromFirestore(docId){
  if(!docId) return;
  try {
    await liveMatchesDocRef().set({ [docId]: firebase.firestore.FieldValue.delete() }, { merge: true });
  } catch(e){ /* noop */ }
}

let liveMatchesUnsub = null;
function subscribeLiveMatches(){
  if(liveMatchesUnsub) return;
  try {
    liveMatchesUnsub = liveMatchesDocRef().onSnapshot(doc => {
      const raw = doc.exists ? (doc.data() || {}) : {};
      state.liveMatches = decodeFromFirestore(raw);
      render();
    }, err => console.warn('No se pudo escuchar los partidos en vivo', err));
  } catch(e){ console.warn('No se pudo iniciar la escucha de partidos en vivo', e); }
}

          <span style="font-size:32px;">🎾</span> Normal
        </button>
      </div>
      <button class="btn btn-ghost" onclick="document.getElementById('point-type-popup').style.display='none'" style="margin-top:30px;width:100%;padding:15px;font-size:18px;">Cancelar</button>
    </div>
  `;
  syncLiveMatchToFirestore();
}

let pendingSide = null;

function promptPointType(side) {
  pendingSide = side;
  const name = side === 'A' ? liveMatch.nameA : liveMatch.nameB;
  document.getElementById('point-type-title').innerText = `Punto de ${name}`;
  document.getElementById('point-type-popup').style.display = 'flex';
}

function registerPoint(type) {
  document.getElementById('point-type-popup').style.display = 'none';
  
  liveMatch.history.push(JSON.parse(JSON.stringify({
    ptsA: liveMatch.ptsA, ptsB: liveMatch.ptsB,
    gamesA: liveMatch.gamesA, gamesB: liveMatch.gamesB,
    setsWonA: liveMatch.setsWonA, setsWonB: liveMatch.setsWonB,
    sets: liveMatch.sets, stats: liveMatch.stats,
    server: liveMatch.server, pointLog: liveMatch.pointLog, gameLog: liveMatch.gameLog
  })));

  if(type !== 'normal') {
    if(type === 'error') {
      const rival = pendingSide === 'A' ? 'B' : 'A';
      liveMatch.stats[rival].unfError++;
    } else {
      liveMatch.stats[pendingSide][type]++;
    }
  }

  liveMatch.pointLog.push({
    side: pendingSide, // quién ganó el punto
    type, // 'ace' | 'winner' | 'error' (rival regaló el punto) | 'normal'
    server: liveMatch.server, // quién sacaba en este punto
    setIndex: liveMatch.sets.length,
    gameIndex: liveMatch.gamesA + liveMatch.gamesB,
    ts: Date.now()
  });

  const winner = pendingSide;
  const loser = pendingSide === 'A' ? 'B' : 'A';
  const wPts = liveMatch[`pts${winner}`];
  const lPts = liveMatch[`pts${loser}`];

  if (wPts === 40 && lPts === 40) {
    liveMatch[`pts${winner}`] = 'AD';
  } else if (wPts === 40 && lPts === 'AD') {
    liveMatch[`pts${loser}`] = 40; 
  } else if (wPts === 40 || wPts === 'AD') {
    winGame(winner);
  } else {
    const nextPt = {0: 15, 15: 30, 30: 40};
    liveMatch[`pts${winner}`] = nextPt[wPts];
  }
  if (liveMatch) {
    renderLiveUmpire();
  }
}

function winGame(side) {
  liveMatch.gameLog.push({
    setIndex: liveMatch.sets.length,
    gameIndex: liveMatch.gamesA + liveMatch.gamesB,
    server: liveMatch.server,
    winner: side
  });
  liveMatch.ptsA = 0; liveMatch.ptsB = 0;
  liveMatch[`games${side}`]++;
  // Alternar el saque para el próximo juego
  liveMatch.server = liveMatch.server === 'A' ? 'B' : 'A';
  const targetGames = liveMatch.rules.gamesPerSet || 2;
  
  if (liveMatch[`games${side}`] >= targetGames) {
    winSet(side);
  }
}

function winSet(side) {
  liveMatch.sets.push([liveMatch.gamesA, liveMatch.gamesB]);
  liveMatch[`setsWon${side}`]++;
  liveMatch.gamesA = 0; liveMatch.gamesB = 0;

  const targetSets = liveMatch.rules.format === 'bestOf3' ? 2 : 1;
  
  if (liveMatch[`setsWon${side}`] >= targetSets) {
    finishMatch();
  }
}

function undoLastPoint() {
  if (liveMatch.history.length === 0) return;
  const lastState = liveMatch.history.pop();
  liveMatch.ptsA = lastState.ptsA; liveMatch.ptsB = lastState.ptsB;
  liveMatch.gamesA = lastState.gamesA; liveMatch.gamesB = lastState.gamesB;
  liveMatch.setsWonA = lastState.setsWonA; liveMatch.setsWonB = lastState.setsWonB;
  liveMatch.sets = lastState.sets;
  liveMatch.stats = lastState.stats;
  liveMatch.server = lastState.server;
  liveMatch.pointLog = lastState.pointLog;
  liveMatch.gameLog = lastState.gameLog;
  renderLiveUmpire();
}

function finishMatch() {
  // 1. Copiamos los datos finales antes de borrar el partido de la memoria
  const finalSets = [...liveMatch.sets];
  const finalStats = JSON.parse(JSON.stringify(liveMatch.stats));
  const finalPointLog = JSON.parse(JSON.stringify(liveMatch.pointLog));
  const finalGameLog = JSON.parse(JSON.stringify(liveMatch.gameLog));
  const callback = liveMatch.onFinishCallback;

  // Dejamos las estadísticas detalladas disponibles para quien vaya a
  // guardar el resultado (partido libre o de torneo) justo después.
  window.AceApp._lastLiveStats = {
    stats: finalStats,
    pointLog: finalPointLog,
    gameLog: finalGameLog,
    participantsA: liveMatch.participantsA || [],
    participantsB: liveMatch.participantsB || []
  };

  // 2. Cerramos el overlay (esto vuelve liveMatch = null)
  closeLiveUmpire(true);

  // 3. Ejecutamos el aviso usando la copia que guardamos
  if(callback) {
    callback(finalSets, finalStats);
  }
}

// Se limpia cada vez que se abre un modal de carga de partido "desde cero",
// para no arrastrar por error las estadísticas de un arbitraje anterior
// a un partido que finalmente se cargó a mano.
function clearPendingLiveStats() {
  window.AceApp._lastLiveStats = null;
}

function closeLiveUmpire(finished = false) {
  if (!finished) {
    if(!confirm("¿Seguro que quieres salir? El progreso del partido se perderá.")) return;
  }
  const docId = liveMatch ? liveMatch.docId : null;
  const overlay = document.getElementById('umpire-overlay');
  if (overlay) overlay.remove();
  liveMatch = null;
  removeLiveMatchFromFirestore(docId);
}
  // ---------- SISTEMA DE DESAFÍOS ----------
function issueChallenge(toId) {
  if (!state.myPlayerId) {
    return aceAlert("Debes identificarte en el panel superior para lanzar un desafío.");
  }
  const target = playerById(toId);
  if (!target) return;

  // Sugerir la fecha de hoy por defecto
  const today = new Date().toISOString().split('T')[0];

  // 1. Eliminar el modal anterior si quedó alguno pegado
  const existingModal = document.getElementById('challenge-modal');
  if (existingModal) existingModal.remove();

  const html = `
    <div class="overlay" id="challenge-modal">
      <div class="modal">
        <h2>⚔️ Desafiar a ${esc(target.name)}</h2>
        <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">Selecciona la fecha en el calendario para proponer este partido libre.</p>
        <div class="field">
          <label>Fecha propuesta</label>
<input type="date" id="challenge-date-input" value="${today}" min="${today}" style="cursor:pointer;" onclick="this.showPicker()">
</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="document.getElementById('challenge-modal').remove()">Cancelar</button>
          <button class="btn btn-ball" onclick="AceApp.confirmChallenge('${toId}')">Enviar desafío</button>
        </div>
      </div>
    </div>
  `;
  
  // 2. ¡EL TRUCO ESTÁ AQUÍ! Insertarlo dentro de 'ace-app' para que tome los colores y diseño.
  document.getElementById('ace-app').insertAdjacentHTML('beforeend', html);
}
async function confirmChallenge(toId) {
  const dateVal = document.getElementById('challenge-date-input').value;
  if (!dateVal) return aceAlert("Debes seleccionar una fecha.");
  
  document.getElementById('challenge-modal').remove();

  state.challenges = state.challenges || [];
  state.challenges.push({
    id: uid(),
    fromId: state.myPlayerId,
    toId: toId,
    date: dateVal,
    status: 'pending',
    createdAt: Date.now(),
    votes: {}
  });

  await save('challenges', state.challenges);
  render();
  playHitSound();
  aceAlert('¡Desafío enviado con éxito! ⚔️');
}
// Abre la "tarjeta" de un partido no jugado (desafío aceptado) con la barra de
// votación de la comunidad para elegir quién creen que va a ganar.
function openMatchVoteModal(challengeId) {
  const c = (state.challenges || []).find(x => x.id === challengeId);
  if (!c) return aceAlert("No se encontró el partido.");
  const html = `
    <button class="close-x" onclick="AceApp.closeModal()">×</button>
    <div style="background:var(--court);border:2px solid var(--ball);border-radius:12px;padding:16px;color:var(--chalk);max-width:340px;margin:10px auto;text-align:center;">
      <div style="font-size:11px;letter-spacing:1px;color:var(--ball);text-transform:uppercase;font-weight:700;">Circuito Ace · Partido por jugar</div>
      <div style="font-size:13px;color:var(--muted);margin:8px 0;">${c.date ? '📅 ' + esc(c.date) : 'Fecha por confirmar'}</div>
      <div style="display:flex;justify-content:space-around;align-items:center;margin:15px 0;">
        <div style="flex:1;"><div style="font-size:15px;font-weight:700;">${esc(playerName(c.fromId))}</div></div>
        <div style="font-size:14px;font-weight:900;color:var(--ball);padding:0 8px;">VS</div>
        <div style="flex:1;"><div style="font-size:15px;font-weight:700;">${esc(playerName(c.toId))}</div></div>
      </div>
      ${voteBarHtml(c)}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="AceApp.closeModal()">Cerrar</button>
    </div>`;
  openModal(html);
}
// Registra (o cambia/retira) el voto del jugador identificado sobre quién ganará
// un partido todavía no jugado.
async function voteMatch(challengeId, pickId) {
  if (!state.myPlayerId) return aceAlert("Identifícate arriba para votar por tu favorito. 🗳️");
  const c = (state.challenges || []).find(x => x.id === challengeId);
  if (!c) return;
  if (state.myPlayerId === c.fromId || state.myPlayerId === c.toId) {
    // Los dos protagonistas del partido no pueden votar en su propio duelo.
    return aceAlert("Como juegas este partido, no puedes votar en él 😉");
  }
  c.votes = c.votes || {};
  if (c.votes[state.myPlayerId] === pickId) {
    delete c.votes[state.myPlayerId]; // volver a tocar el mismo pick retira el voto
  } else {
    c.votes[state.myPlayerId] = pickId;
  }
  await save('challenges', state.challenges);
  render();
  if (document.getElementById('ace-overlay')) {
    closeModal();
    openMatchVoteModal(challengeId);
  }
}
async function updateChallengeStatus(challengeId, newStatus) {
  const ch = state.challenges.find(c => c.id === challengeId);
  if (!ch) return;  
  ch.status = newStatus;
  ch.notifiedFrom = false; // Permite gatillar la notificación al desafiante
  await save('challenges', state.challenges);
  render();
  if (newStatus === 'accepted') aceAlert("¡Desafío Aceptado! Preparen las raquetas. 🎾");
  else if (newStatus === 'rejected') aceAlert("Desafío rechazado.");
  else if (newStatus === 'cancelled') aceAlert("Desafío cancelado.");
}
  function checkChallengeNotifications() {
  if (!state.myPlayerId || !state.challenges) return;

  // 1. Pop-up para el desafiado (Reta nueva)
  const pendingForMe = state.challenges.find(c => 
    c.toId === state.myPlayerId && 
    c.status === 'pending' && 
    !c.notifiedTo
  );

  if (pendingForMe) {
    pendingForMe.notifiedTo = true;
    save('challenges', state.challenges);
    aceAlert(`⚔️ ¡NUEVO DESAFÍO! ${playerName(pendingForMe.fromId)} te ha retado para el día ${pendingForMe.date}.`);
    return;
  }

  // 2. Pop-up para el desafiante (Respuesta recibida)
  const respondedForMe = state.challenges.find(c => 
    c.fromId === state.myPlayerId && 
    (c.status === 'accepted' || c.status === 'rejected' || c.status === 'cancelled') && 
    !c.notifiedFrom
  );

  if (respondedForMe) {
    respondedForMe.notifiedFrom = true;
    save('challenges', state.challenges);
    let resultText = 'ACEPTÓ 🎾';
    if (respondedForMe.status === 'rejected') resultText = 'RECHAZÓ ❌';
    if (respondedForMe.status === 'cancelled') resultText = 'CANCELÓ 🚫';
    aceAlert(`🔔 ${playerName(respondedForMe.toId)} ${resultText} tu desafío programado para el ${respondedForMe.date}.`);
  }
}
  async function closeSeason() {
  if (!state.isAdmin) return aceAlert("Solo los administradores pueden cerrar una temporada.");

  const defaultName = `Temporada ${new Date().getMonth() < 6 ? '1' : '2'} - ${new Date().getFullYear()}`;
  const seasonName = prompt("Nombre de la temporada a cerrar:", defaultName);
  if (!seasonName) return;

  const singlesRank = singlesRankingList();
  const doublesRank = doublesRankingList();

  if (singlesRank.length === 0) return aceAlert("No hay datos de jugadores para cerrar la temporada.");

  const newSeason = {
    id: uid(),
    name: seasonName,
    date: new Date().toISOString().split('T')[0],
    singlesChampion: singlesRank[0] ? singlesRank[0].id : null,
    singlesPodium: singlesRank.slice(0, 3).map(r => ({ id: r.id, points: r.points })),
    doublesPodium: doublesRank.slice(0, 3).map(r => ({ id: r.id, points: r.points }))
  };

  state.seasons = state.seasons || [];
  state.seasons.unshift(newSeason);
  await save('seasons', state.seasons);
  render();
  aceAlert(`🏆 ¡${seasonName} cerrada oficialmente! El campeón quedó registrado en el Salón de la Fama.`);
}
