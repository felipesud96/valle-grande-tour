<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&display=swap');

#ace-app {
  --clay: #B5502E;
  --clay-dark: #8C3D22;
  --clay-light: #D97A4F;
  --court: #0A0A0A;
  --court-2: #161615;
  --court-3: #201F1C;
  --chalk: #F4F0E2;
  --ball: #D4AF37;
  --ink: #14120A;
  --muted: #ACA89D;
  --line: rgba(244,240,226,0.12);

  font-family: 'Work Sans', sans-serif;
  background: var(--court);
  color: var(--chalk);
  min-height: 100vh;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  font-size: var(--ace-text-scale, 100%);
}

#ace-app * { box-sizing: border-box; }

#ace-app h1, #ace-app h2, #ace-app h3, #ace-app .disp {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.03em;
  font-weight: 400;
}

#ace-app .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }

/* ---------- TOPBAR ---------- */
#ace-app .topbar {
  background: linear-gradient(180deg, var(--court-2), var(--court));
  padding: 22px 20px 0;
  border-bottom: 1px solid var(--line);
}
#ace-app .topbar-inner {
  max-width: 980px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; padding-bottom: 18px;
}
#ace-app .brand { display: flex; align-items: center; gap: 12px; }
#ace-app .brand-text { text-align: left; }
#ace-app .brand-mark { width: 80px; height: 58px; flex-shrink: 0; position: relative; overflow: visible; border-radius: 0; }
#ace-app .brand-video { width: 100%; height: 100%; object-fit: contain; display: block; mix-blend-mode: screen; }
#ace-app .ball-shadow { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.55)); }

#ace-app .flame-glow-outer {
  position: absolute; left: 50%; bottom: 6px; width: 92px; height: 92px;
  transform: translate(-50%,10%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,80,10,0.5) 0%, rgba(220,30,0,0.22) 45%, rgba(200,0,0,0) 72%);
  filter: blur(10px);
  z-index: 1;
  animation: aceGlowOuter 1.1s ease-in-out infinite alternate;
  pointer-events: none;
}
#ace-app .flame-glow {
  position: absolute; left: 50%; bottom: 4px; width: 62px; height: 62px;
  transform: translate(-50%,10%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,210,110,0.85) 0%, rgba(255,130,20,0.5) 40%, rgba(255,60,0,0) 72%);
  filter: blur(6px);
  z-index: 1;
  animation: aceGlow 0.9s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes aceGlowOuter {
  0%   { transform: translate(-50%,10%) scale(0.85); opacity: 0.6; }
  100% { transform: translate(-50%,10%) scale(1.2); opacity: 1; }
}
@keyframes aceGlow {
  0%   { transform: translate(-50%,10%) scale(0.85); opacity: 0.8; }
  100% { transform: translate(-50%,10%) scale(1.22); opacity: 1; }
}

#ace-app .flame-layer { transform-box: fill-box; transform-origin: 50% 100%; mix-blend-mode: screen; }
#ace-app .fl-outer  { animation: aceFlickerOuter 0.95s ease-in-out infinite; }
#ace-app .fl-mid    { animation: aceFlickerMid 0.8s ease-in-out infinite 0.08s; }
#ace-app .fl-inner  { animation: aceFlickerInner 0.65s ease-in-out infinite 0.15s; }
#ace-app .fl-wisp   { animation: aceFlickerWisp 1.05s ease-in-out infinite 0.25s; mix-blend-mode: screen; transform-box: fill-box; transform-origin: 50% 100%; }

@keyframes aceFlickerOuter {
  0%,100% { transform: scaleY(1) skewX(-3deg); opacity: 0.9; }
  50%     { transform: scaleY(1.08) skewX(3deg); opacity: 1; }
}
@keyframes aceFlickerMid {
  0%,100% { transform: scaleY(0.97) skewX(3deg); opacity: 0.92; }
  50%     { transform: scaleY(1.1) skewX(-4deg); opacity: 1; }
}
@keyframes aceFlickerInner {
  0%,100% { transform: scaleY(1) skewX(-2deg); opacity: 0.95; }
  50%     { transform: scaleY(1.14) skewX(4deg); opacity: 1; }
}
@keyframes aceFlickerWisp {
  0%,100% { transform: scaleY(1) rotate(-4deg); opacity: 0.75; }
  50%     { transform: scaleY(1.15) rotate(5deg); opacity: 0.95; }
}

#ace-app .spark { transform-box: fill-box; transform-origin: 50% 50%; animation: aceSpark 1.3s ease-in infinite; }
@keyframes aceSpark {
  0%   { transform: translateY(0) scale(1); opacity: 0; }
  25%  { opacity: 1; }
  100% { transform: translateY(-22px) scale(0.3); opacity: 0; }
}
#ace-app .brand-text h1 { font-size: 30px; line-height: 1; margin: 0; color: var(--chalk); }
#ace-app .brand-text span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
#ace-app .fund-chip {
  background: var(--court-3); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 18px; text-align: center;
}
#ace-app .fund-chip .amt { font-family:'Bebas Neue'; font-size: 22px; color: var(--ball); display:block; }
#ace-app .fund-chip .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* seam divider signature */
#ace-app .seam { width: 100%; height: 22px; max-width:980px; margin: 0 auto; display:block; }

/* ---------- TABS ---------- */
#ace-app .tabs {
  display: flex; gap: 4px; max-width: 980px; margin: 0 auto; padding: 0 20px;
  overflow-x: auto; border-bottom: 1px solid var(--line);
}
#ace-app .tab {
  font-family: 'Bebas Neue'; font-size: 16px; letter-spacing: 0.06em;
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 10px 16px 12px; white-space: nowrap; position: relative; top:1px;
  border-bottom: 3px solid transparent;
}
#ace-app .tab.active { color: var(--ball); border-bottom-color: var(--ball); }
#ace-app .tab:hover:not(.active) { color: var(--chalk); }

/* ---------- SECTION ---------- */
#ace-app .section { padding-top: 26px; }
#ace-app .section-head { display:flex; justify-content: space-between; align-items:center; gap:12px; margin-bottom: 16px; flex-wrap: wrap;}
#ace-app .section-head h2 { font-size: 26px; color: var(--chalk); margin:0; }
#ace-app .section-sub { color: var(--muted); font-size: 13px; margin-top: -10px; margin-bottom: 18px; }

/* ---------- BUTTONS ---------- */
#ace-app .btn {
  font-family: 'Work Sans'; font-weight: 600; font-size: 13px;
  border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: 6px;
}
#ace-app .btn-primary { background: var(--clay); color: var(--chalk); }
#ace-app .btn-primary:hover { background: var(--clay-light); }
#ace-app .btn-ghost { background: transparent; border-color: var(--line); color: var(--chalk); }
#ace-app .btn-ghost:hover { border-color: var(--ball); color: var(--ball); }
#ace-app .btn-ball { background: var(--ball); color: var(--ink); }
#ace-app .btn-sm { padding: 6px 11px; font-size: 12px; }
#ace-app .btn-danger { background: transparent; color: #E08A6E; border-color: rgba(224,138,110,0.4);}

/* ---------- RANKING ---------- */
#ace-app .rank-table { display: flex; flex-direction: column; gap: 8px; }
#ace-app .rank-row {
  display: grid; grid-template-columns: 44px 46px 1fr auto; align-items: center; gap: 14px;
  background: var(--court-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
}
#ace-app .rank-row.top1 { border-color: var(--ball); background: linear-gradient(90deg, rgba(214,226,75,0.12), var(--court-2)); }
#ace-app .rank-pos { font-family:'Bebas Neue'; font-size: 26px; color: var(--muted); text-align:center; }
#ace-app .rank-row.top1 .rank-pos, #ace-app .rank-row.top2 .rank-pos, #ace-app .rank-row.top3 .rank-pos { color: var(--ball); }
#ace-app .avatar {
  width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
  background: var(--court-3); display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue'; font-size: 18px; color: var(--muted); border: 1px solid var(--line);
}
#ace-app .rank-name-block { display:flex; flex-direction: column; }
#ace-app .rank-name { font-weight: 700; font-size: 15px; }
#ace-app .rank-meta { font-size: 11.5px; color: var(--muted); }
#ace-app .rank-pts { text-align:right; }
#ace-app .rank-pts .num { font-family:'Bebas Neue'; font-size: 22px; color: var(--ball); }
#ace-app .rank-pts .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; }

/* ---------- CARDS / GRID ---------- */
#ace-app .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
#ace-app .card {
  background: var(--court-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
}
#ace-app .player-card { text-align:center; position: relative; }
#ace-app .player-card .avatar { width: 84px; height: 84px; margin: 0 auto 10px; font-size: 28px; }
#ace-app .player-card h3 { font-size: 20px; margin: 0 0 2px; }
#ace-app .player-card .rank-tag {
  display:inline-block; font-size: 10.5px; color: var(--ink); background: var(--ball);
  padding: 2px 8px; border-radius: 20px; font-weight: 700; margin-bottom: 8px;
}
#ace-app .player-stats { display:flex; flex-wrap: wrap; gap: 6px; justify-content:center; margin: 10px 0; }
#ace-app .stat-pill {
  font-size: 10.5px; color: var(--muted); background: var(--court); border: 1px solid var(--line);
  padding: 3px 9px; border-radius: 20px;
}
#ace-app .player-bio { font-size: 12.5px; color: var(--muted); margin: 8px 0; line-height:1.5; }
#ace-app .player-badges { display:flex; flex-wrap:wrap; gap: 5px; justify-content:center; margin-top: 8px; }
#ace-app .badge-emoji { font-size: 16px; }
#ace-app .card-actions { display:flex; gap: 6px; justify-content:center; margin-top: 12px; }

/* ---------- TOURNAMENTS ---------- */
#ace-app .tourn-card { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--court-2); margin-bottom: 14px; }
#ace-app .tourn-top { padding: 14px 16px; display:flex; justify-content: space-between; align-items:flex-start; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line);}
#ace-app .tourn-title { font-family:'Bebas Neue'; font-size: 22px; }
#ace-app .tier-badge {
  display:inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing:0.06em;
  padding: 3px 9px; border-radius: 6px; color: var(--chalk); margin-bottom:4px;
}
#ace-app .tourn-meta { font-size: 12px; color: var(--muted); }
#ace-app .tourn-fee { text-align:right; }
#ace-app .tourn-fee .amt { font-family:'Bebas Neue'; font-size: 20px; color: var(--ball); }
#ace-app .tourn-body { padding: 14px 16px; }
#ace-app .status-pill { font-size: 10.5px; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
#ace-app .status-open { background: rgba(214,226,75,0.18); color: var(--ball); }
#ace-app .status-done { background: rgba(159,182,166,0.18); color: var(--muted); }
#ace-app .podium { display:flex; flex-direction:column; gap: 6px; margin-top: 8px; }
#ace-app .podium-row { display:flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
#ace-app .podium-row:last-child { border-bottom:none; }
#ace-app .podium-role { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing:0.06em; }
#ace-app .participants-chip { font-size: 11.5px; color: var(--muted); background: var(--court); padding: 3px 9px; border-radius: 20px; display:inline-block; margin: 2px 3px 0 0; border: 1px solid var(--line);}

#ace-app .pay-chip {
  font-size: 12px; color: var(--chalk); background: var(--court); padding: 5px 11px; border-radius: 20px;
  display:inline-block; margin: 3px 5px 3px 0; border: 1px solid var(--line); cursor: pointer; transition: all .15s ease;
}
#ace-app .pay-chip:hover { border-color: var(--ball); }
#ace-app .pay-chip.paid { background: rgba(212,175,55,0.16); border-color: var(--ball); color: var(--ball); font-weight: 600; }
#ace-app .pay-chip.pending { background: rgba(224,138,110,0.12); border-color: #E08A6E; color: #E08A6E; }

#ace-app .suggest-wrap { display:flex; flex-wrap: wrap; gap: 6px; }
#ace-app .suggest-chip {
  font-family: 'Work Sans'; font-size: 11.5px; color: var(--chalk); background: var(--court);
  border: 1px solid var(--line); border-radius: 20px; padding: 5px 10px; cursor: pointer;
}
#ace-app .suggest-chip:hover { border-color: var(--ball); color: var(--ball); }

/* ---------- ACHIEVEMENTS ---------- */
#ace-app .ach-card { display:flex; gap: 12px; align-items:flex-start; }
#ace-app .ach-emoji { font-size: 26px; }
#ace-app .ach-title { font-weight: 700; font-size: 14px; }
#ace-app .ach-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
#ace-app .ach-player { font-size: 11px; color: var(--ball); margin-top: 4px; }

/* ---------- EMPTY STATE ---------- */
#ace-app .empty {
  text-align: center; padding: 40px 20px; color: var(--muted); border: 1px dashed var(--line);
  border-radius: 12px; font-size: 13.5px;
}
#ace-app .empty .disp { color: var(--chalk); font-size: 22px; display:block; margin-bottom: 6px; }

/* ---------- MODAL ---------- */
#ace-app .ace-toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  background: var(--court-3); border: 1px solid var(--ball); color: var(--chalk);
  padding: 12px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 500;
  z-index: 2000; max-width: 90%; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  animation: aceToastIn 0.18s ease-out;
}
@keyframes aceToastIn {
  from { opacity: 0; transform: translate(-50%, -10px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}

#ace-app .overlay {
  position: fixed; inset: 0; background: rgba(10,20,14,0.72); display:flex; align-items:center; justify-content:center;
  z-index: 999; padding: 16px; backdrop-filter: blur(2px);
}
#ace-app .modal {
  background: var(--court-2); border: 1px solid var(--line); border-radius: 14px; padding: 22px;
  max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto;
}
#ace-app .modal h2 { font-size: 24px; margin: 0 0 14px; }
#ace-app .field { margin-bottom: 12px; }
#ace-app .field label { display:block; font-size: 11.5px; text-transform: uppercase; letter-spacing:0.06em; color: var(--muted); margin-bottom: 5px; }
#ace-app .field input[type=text], #ace-app .field input[type=number], #ace-app .field input[type=date],
#ace-app .field select, #ace-app .field textarea {
  width: 100%; background: var(--court); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; color: var(--chalk); font-family: 'Work Sans'; font-size: 13.5px;
}
#ace-app .field textarea { resize: vertical; min-height: 60px; }
#ace-app .field-row { display:flex; gap: 10px; }
#ace-app .field-row .field { flex:1; }
#ace-app .modal-actions { display:flex; justify-content:flex-end; gap: 8px; margin-top: 18px; }
#ace-app .photo-picker { display:flex; align-items:center; gap: 12px; }
#ace-app .check-list { max-height: 160px; overflow-y:auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
#ace-app .check-item { display:flex; align-items:center; gap: 8px; font-size: 13px; padding: 4px 0; }
#ace-app .tier-picker { display:flex; gap: 8px; flex-wrap: wrap; }
#ace-app .tier-opt { flex:1; min-width: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor:pointer; }
#ace-app .tier-opt.sel { border-color: var(--ball); background: rgba(214,226,75,0.08); }
#ace-app .tier-opt .tname { font-weight: 700; font-size: 12.5px; }
#ace-app .tier-opt .tinfo { font-size: 10.5px; color: var(--muted); }
#ace-app .close-x { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer;}
#ace-app .btn-spinner {
  display:inline-block; width:11px; height:11px; border-radius:50%;
  border: 2px solid rgba(255,255,255,0.4); border-top-color: currentColor;
  animation: aceSpin 0.7s linear infinite; vertical-align:middle;
}
@keyframes aceSpin { to { transform: rotate(360deg); } }
#ace-app .btn:disabled { opacity:0.7; cursor:default; }

@media (max-width: 560px) {
  #ace-app .rank-row { grid-template-columns: 34px 40px 1fr auto; padding: 8px 10px; gap: 10px; }
  #ace-app .section-head h2 { font-size: 22px; }
  #ace-app .tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
    background: var(--court-2); border-top: 1px solid var(--line); border-bottom: none;
    justify-content: space-around; padding: 0 2px; max-width: none;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.4);
  }
  #ace-app .tab { font-size: 10.5px; padding: 10px 4px 8px; flex: 1; text-align: center; white-space: normal; }
  #ace-app .wrap { padding-bottom: 76px; }
}
  /* ---------- BRACKET VISUAL (ÁRBOL DE TORNEO) ---------- */
#ace-app .bracket-container {
  display: flex;

  padding: 16px 0 24px;

}
#ace-app .bracket-round {
  display: flex;
  flex-direction: column;

}
#ace-app .bracket-round-title {

}
#ace-app .bracket-player-row:last-child {

}
#ace-app .bracket-player-row.winner .bp-name,

#ace-app .bp-name {

#ace-app .bp-score {

#ace-app .bp-check {
  color: var(--ball);
  font-size: 14px;
  margin-left: 8px;
}

    if (user) { currentUid = user.uid; resolve(user.uid); }
  });
  auth.signInAnonymously().catch((err) => {
    console.error('Error de autenticación anónima:', err);
    reject(err);
  });
});
const authReady = Promise.race([
  authReadyRaw,
  new Promise((_, reject) => setTimeout(() => reject(new Error('Tiempo de espera agotado conectando con Firebase.')), 12000))
]);

function refFor(key, shared) {
  return shared
    ? db.collection('shared').doc(key)
    : db.collection('users').doc(currentUid).collection('data').doc(key);
}

async function withRetry(fn, retries = 4, delayMs = 1500) {
  let lastErr;
  for (let i = 0; i < retries; i++) {
    try {
      return await fn();
    } catch (err) {
      lastErr = err;
      if (i < retries - 1) await new Promise((r) => setTimeout(r, delayMs));
    }
  }
  throw lastErr;
}

window.storage = {
  get: async function (key, shared) {
    await authReady;
    const snap = await withRetry(() => refFor(key, shared).get());
    return snap.exists ? { value: JSON.stringify(snap.data().value) } : null;
  },
  set: async function (key, value, shared) {
    await authReady;
    await withRetry(() => refFor(key, shared).set({ value: JSON.parse(value) }));
    return true;
  },
  delete: async function (key, shared) {
    await authReady;
    await withRetry(() => refFor(key, shared).delete());
    return true;
  }
};

<script>
(function(){

let TIERS = [
  { id:'slam', label:'Grand Slam del Circuito', short:'GS', points:{champion:1000, finalist:650, semi:400, quarter:200, r1:100}, fee:4000, color:'#B5502E' },

// ---------- STORAGE ----------
async function loadAll(){
  state.players = await safeGet('players', []);
  state.tournaments = await safeGet('tournaments', []);
  state.doubles = await safeGet('doubles', []);
  state.achievements = await safeGet('achievements', []);
  state.expenses = await safeGet('expenses', []);
  state.myPlayerId = await safeGet('my-player-id', null, false);
  state.isAdmin = await safeGet('is-admin', false, false);
  state.matchRules = await safeGet('match-rules', {format:'single', gamesPerSet:3});

  if(tierFees){
    TIERS.forEach(t=>{ if(tierFees[t.id]!=null) t.fee = tierFees[t.id]; });

    TIERS.forEach(t=>{ if(tierPoints[t.id]) t.points = {...t.points, ...tierPoints[t.id]}; });

}
async function safeGet(key, fallback, shared=true){
  try {
    const res = await window.storage.get(key, shared);
    return res ? JSON.parse(res.value) : fallback;
  } catch(e){ return fallback; }
}
async function save(key, value, shared=true){

    await window.storage.set(key, JSON.stringify(value), shared); 
  }
  catch(e){ 
    console.warn('Advertencia al guardar', key, e); 
    if(e && e.code === 'permission-denied') {
        aceAlert('No se pudo guardar. Permisos insuficientes.');

// ---------- COMPUTATION ----------
function singlesPointsByPlayer(){
  const pts = {};
  state.players.forEach(p => pts[p.id] = 0);
  state.tournaments.filter(t=>t.status==='completed').forEach(t=>{
    const tier = tierOf(t.tier);
    if(!tier) return;
    const assigned = new Set();
    ['champion','finalist','semi','quarter'].forEach(role=>{
      (t.results[role]||[]).forEach(pid=>{
        pts[pid] = (pts[pid]||0) + tier.points[role];
        assigned.add(pid);
      });
    });
    (t.participants||[]).forEach(pid=>{
      if(!assigned.has(pid)) pts[pid] = (pts[pid]||0) + tier.points.r1;
    });
  });
  return pts;
}
function doublesPointsByPlayer(){
  const pts = {};
  state.players.forEach(p => pts[p.id] = 0);
  state.doubles.filter(t=>t.status==='completed').forEach(t=>{
    const tier = tierOf(t.tier);
    if(!tier) return;
    const assigned = new Set();
    ['champion','finalist','semi','quarter'].forEach(role=>{
      (t.results[role]||[]).forEach(pairIdx=>{
        const pair = t.pairs[pairIdx];
        if(!pair) return;
        pair.forEach(pid=>{ pts[pid] = (pts[pid]||0) + tier.points[role]; assigned.add(pid); });
      });
    });
    (t.pairs||[]).forEach(pair=>{
      pair.forEach(pid=>{ if(!assigned.has(pid)) pts[pid] = (pts[pid]||0) + tier.points.r1; });
    });
  });
  return pts;
}
function titlesByPlayer(list, isDoubles){
  const t = {};
  list.filter(x=>x.status==='completed').forEach(x=>{
    if(isDoubles){
      (x.results.champion||[]).forEach(pairIdx=>{
        const pair = x.pairs[pairIdx]; if(!pair) return;
        pair.forEach(pid=> t[pid] = (t[pid]||0)+1 );
      });
    } else {
      (x.results.champion||[]).forEach(pid=> t[pid] = (t[pid]||0)+1 );
    }
  });
  return t;
}
function finalsByPlayer(list){
  const f = {};
  list.filter(x=>x.status==='completed').forEach(x=>{
    (x.results.finalist||[]).forEach(pid=> f[pid] = (f[pid]||0)+1 );
  });
  return f;
}
function paidTotal(){
  let total = 0;
  state.tournaments.forEach(t=>{ total += (tierOf(t.tier)?.fee||0) * (t.paid||[]).length; });
  state.doubles.forEach(t=>{ total += (tierOf(t.tier)?.fee||0) * (t.paid||[]).length; });
  return total;
}
function expensesTotal(){
  return state.expenses.reduce((sum,e)=> sum + (Number(e.amount)||0), 0);
}
function fundTotal(){
  return paidTotal() - expensesTotal();
}
function playerById(id){ return state.players.find(p=>p.id===id); }
function playerName(id){ const p = playerById(id); return p ? p.name : '—'; }

function roleInSingles(t, pid){
  for(const role of ['champion','finalist','semi','quarter']) if((t.results[role]||[]).includes(pid)) return role;
  return 'r1';
}
function playerHistory(playerId){
  return state.tournaments
    .filter(t=>t.status==='completed' && (t.participants||[]).includes(playerId))
    .map(t=>({date: t.date||'', role: roleInSingles(t, playerId)}))
    .sort((a,b)=> a.date.localeCompare(b.date));
}
function combinedTitles(playerId){
  return (titlesByPlayer(state.tournaments,false)[playerId]||0) + (titlesByPlayer(state.doubles,true)[playerId]||0);
}
function maxCombinedTitles(){
  let max = 0;
  state.players.forEach(p=>{ const c = combinedTitles(p.id); if(c>max) max = c; });
  return max;
}

// ---------- MATCH SCORES ----------
function setWinnerSide(set){
  if(!set) return null;
  const [a,b] = set;
  if(a==null || b==null || (a===0 && b===0)) return null;
  if(a>b) return 'A';
  if(b>a) return 'B';
  return null;
}
function matchWinnerSide(match){
  let winsA=0, winsB=0;
  (match.sets||[]).forEach(s=>{
    const w = setWinnerSide(s);
    if(w==='A') winsA++; else if(w==='B') winsB++;
  });
  if(winsA>winsB) return 'A';
  if(winsB>winsA) return 'B';
  return null;
}
function matchTotalGames(match){
  let a=0,b=0;
  (match.sets||[]).forEach(s=>{ if(s){ a += Number(s[0])||0; b += Number(s[1])||0; } });
  return {a,b};
}
function allSinglesMatches(){
  const list = [];
  state.tournaments.forEach(t=>{
    (t.matches||[]).forEach(m=>{
      if((m.sideA||[]).length===1 && (m.sideB||[]).length===1){
        list.push({...m, tournamentName: t.name, tournamentDate: t.date});
      }
    });
  });
  return list;
}
function biggestBlowout(){
  let best = null;
  allSinglesMatches().forEach(m=>{
    const winner = matchWinnerSide(m);
    if(!winner) return;
    const {a,b} = matchTotalGames(m);
    const diff = winner==='A' ? a-b : b-a;
    if(diff>0 && (!best || diff>best.diff)){
      const winnerId = winner==='A' ? m.sideA[0] : m.sideB[0];
      const loserId = winner==='A' ? m.sideB[0] : m.sideA[0];
      best = { diff, winnerId, loserId, match: m };
    }
  });
  return best;
}
function headToHeadRecord(idA, idB){
  const matches = allSinglesMatches().filter(m=>{
    const a = m.sideA[0], b = m.sideB[0];
    return (a===idA && b===idB) || (a===idB && b===idA);
  }).sort((x,y)=>(x.tournamentDate||'').localeCompare(y.tournamentDate||''));
  let winsA=0, winsB=0;
  const detail = matches.map(m=>{
    const winnerSide = matchWinnerSide(m);
    const sideAisA = m.sideA[0]===idA;
    let winnerId = null;
    if(winnerSide==='A') winnerId = sideAisA ? idA : idB;
    else if(winnerSide==='B') winnerId = sideAisA ? idB : idA;
    if(winnerId===idA) winsA++;
    if(winnerId===idB) winsB++;
    const scoreline = (m.sets||[]).filter(s=>s && (s[0]!=null||s[1]!=null)).map(s=>{
      const sA = sideAisA ? s[0] : s[1];
      const sB = sideAisA ? s[1] : s[0];
      return `${sA}-${sB}`;
    }).join(', ');
    return { tournamentName: m.tournamentName, date: m.tournamentDate, scoreline, winnerId };
  });
  return { winsA, winsB, matches: detail };
}

// ---------- BRACKET DRAW ----------
function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function drawHtml(t, isDoubles){
  if(!t.bracket || t.bracket.length===0) return '';
  
  const labelOf = isDoubles 
    ? (id) => id ? (t.pairs[Number(id)]||[]).map(playerName).join(' / ') : 'BYE (Pasa directo)'
    : (id) => id ? playerName(id) : 'BYE (Pasa directo)';
    
  const getRoundName = (rIdx, totalRounds) => {
      const rev = totalRounds - 1 - rIdx;
      if(rev === 0) return 'Final';
      if(rev === 1) return 'Semifinal';
      if(rev === 2) return 'Cuartos de final';
      if(rev === 3) return 'Octavos de final';
      return 'Ronda ' + (rIdx + 1);
  };

  let html = '<div class="bracket-container">';
  
  t.bracket.forEach((round, rIdx) => {
     html += '<div class="bracket-round">';
     html += `<div class="bracket-round-title">${getRoundName(rIdx, t.bracket.length)}</div>`;
     
     round.forEach((m, mIdx) => {
         const p1Name = labelOf(m.p1);
         const p2Name = labelOf(m.p2);
         const isWinner1 = m.winner === m.p1 && m.p1 !== null;
         const isWinner2 = m.winner === m.p2 && m.p2 !== null;
         const isPlayable = m.p1 !== null && m.p2 !== null;
         
         const clickAttr = (isPlayable && state.isAdmin) ? `onclick="AceApp.openBracketMatchModal('${t.id}', ${isDoubles}, ${rIdx}, ${mIdx})"` : '';                  
         html += `
         <div class="bracket-match" ${clickAttr}>
             <div class="bracket-player-row ${isWinner1 ? 'winner' : (m.winner ? 'loser' : '')}">
                 <span class="bp-name">${esc(p1Name)}</span>
                 ${m.scoreLine ? `<span class="bp-score">${m.scoreLine}</span>` : ''}
                 ${isWinner1 ? '<span class="bp-check">✓</span>' : ''}
             </div>
             <div class="bracket-player-row ${isWinner2 ? 'winner' : (m.winner ? 'loser' : '')}">
                 <span class="bp-name">${esc(p2Name)}</span>
                 ${m.scoreLine ? `<span class="bp-score">${m.scoreLine}</span>` : ''}
                 ${isWinner2 ? '<span class="bp-check">✓</span>' : ''}
             </div>
         </div>`;
     });
     html += '</div>';
  });
  
  html += '</div>';
  return html;
}

// ---------- HALL OF FAME ----------
function hallOfFameEntries(){
  const entries = [];
  state.tournaments.filter(t=>t.status==='completed' && (t.results.champion||[]).length).forEach(t=>{
    entries.push({
      type: 'singles', name: t.name, date: t.date||'', tier: tierOf(t.tier),
      championLabel: playerName(t.results.champion[0]),
      runnerUpLabel: (t.results.finalist||[])[0] ? playerName(t.results.finalist[0]) : null,
    });
  });
  state.doubles.filter(t=>t.status==='completed' && (t.results.champion||[]).length).forEach(t=>{
    const pair = t.pairs[t.results.champion[0]] || [];
    const runnerPair = (t.results.finalist||[])[0]!=null ? t.pairs[t.results.finalist[0]] : null;
    entries.push({
      type: 'doubles', name: t.name, date: t.date||'', tier: tierOf(t.tier),
      championLabel: pair.map(playerName).join(' / '),

    });
  });
  return entries.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}

// ---------- GENERAL STATS ----------
function playerMatchStats(playerId){
  const matches = allSinglesMatches().filter(m=> m.sideA[0]===playerId || m.sideB[0]===playerId);
  let wins = 0;
  matches.forEach(m=>{
    const winnerSide = matchWinnerSide(m);
    if(!winnerSide) return;
    const winnerId = winnerSide==='A' ? m.sideA[0] : m.sideB[0];
    if(winnerId===playerId) wins++;
  });
  return { played: matches.length, wins, pct: matches.length ? Math.round(wins/matches.length*100) : null };
}
function tournamentsPlayedCount(playerId){
  const s = state.tournaments.filter(t=>t.status==='completed' && (t.participants||[]).includes(playerId)).length;
  const d = state.doubles.filter(t=>t.status==='completed' && (t.pairs||[]).some(pair=>pair.includes(playerId))).length;
  return s + d;
}
function playerAvatarHtml(p, size){
  if(p && p.photo) return `<img class="avatar" style="width:${size}px;height:${size}px" src="${p.photo}" alt="">`;
  const initials = p ? p.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase() : '?';
  return `<div class="avatar" style="width:${size}px;height:${size}px">${initials}</div>`;
}

function autoBadges(playerId){
  const singlesTitles = (titlesByPlayer(state.tournaments,false)[playerId])||0;
  const doublesTitles = (titlesByPlayer(state.doubles,true)[playerId])||0;
  const finals = (finalsByPlayer(state.tournaments)[playerId])||0;
  const played = state.tournaments.filter(t=>t.status==='completed' && (t.participants||[]).includes(playerId)).length;
  const ranking = singlesRankingList();
  const pos = ranking.findIndex(r=>r.id===playerId) + 1;
  const badges = [];
  if(singlesTitles>=1) badges.push({e:'🏆', t:'Campeón'});
  if(singlesTitles>=3) badges.push({e:'👑', t:'Multicampeón'});
  if(doublesTitles>=1) badges.push({e:'🤝', t:'Campeón de dobles'});
  if(finals>=1 && singlesTitles===0) badges.push({e:'🥈', t:'Finalista'});
  if(pos>=1 && pos<=3 && ranking.length>0) badges.push({e:'⭐', t:'Top 3 del ranking'});
  if(played>=5) badges.push({e:'🎾', t:'Veterano del circuito'});
  if(played===1) badges.push({e:'🌱', t:'Debutante'});

  const hist = playerHistory(playerId);
  const recent = hist.slice(-3).reverse();
  if(recent.length>=2 && recent.slice(0,2).every(h=>h.role==='champion')){
    badges.push({e:'🔥', t:'Racha ganadora'});
  }
  if(recent.length>=2 && recent.every(h=>h.role==='r1')){
    badges.push({e:'📉', t:'Mala racha'});
  }
  const ct = combinedTitles(playerId);
  if(ct>=2 && ct===maxCombinedTitles()){
    badges.push({e:'🐐', t:'El GOAT del circuito'});
  }
  const blowout = biggestBlowout();
  if(blowout && blowout.diff>=3 && blowout.winnerId===playerId){
    badges.push({e:'💥', t:'La paliza del circuito'});
  }
  return badges;
}

function singlesRankingList(){
  const pts = singlesPointsByPlayer();
  return state.players.map(p=>({id:p.id, name:p.name, points: pts[p.id]||0}))
    .sort((a,b)=>b.points-a.points);
}
function doublesRankingList(){
  const pts = doublesPointsByPlayer();
  return state.players.map(p=>({id:p.id, name:p.name, points: pts[p.id]||0}))
    .filter(r=>r.points>0 || state.doubles.some(t=>(t.pairs||[]).flat().includes(r.id)))
    .sort((a,b)=>b.points-a.points);
}

// ---------- VIEW: RANKING ----------
function rankingEvolutionSvg(){
  const completed = [...state.tournaments].filter(t=>t.status==='completed').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(completed.length<2 || state.players.length===0) return '';

  const cumulative = {};
  state.players.forEach(p=> cumulative[p.id]=0);
  const series = {};
  state.players.forEach(p=> series[p.id]=[0]);

  completed.forEach(t=>{
    const tier = tierOf(t.tier);
    if(!tier) return;
    const assigned = new Set();
    ['champion','finalist','semi','quarter'].forEach(role=>{
      (t.results[role]||[]).forEach(pid=>{ cumulative[pid]=(cumulative[pid]||0)+tier.points[role]; assigned.add(pid); });
    });
    (t.participants||[]).forEach(pid=>{ if(!assigned.has(pid)) cumulative[pid]=(cumulative[pid]||0)+tier.points.r1; });
    state.players.forEach(p=> series[p.id].push(cumulative[p.id]||0));
  });

  const topIds = state.players.map(p=>p.id)
    .sort((a,b)=>(series[b][series[b].length-1]) - (series[a][series[a].length-1]))
    .slice(0,5)
    .filter(id => series[id][series[id].length-1] > 0);
  if(topIds.length===0) return '';

  const colors = ['#D4AF37','#B5502E','#4C7A5B','#D97A4F','#8C3D22'];
  const steps = completed.length + 1;
  const maxVal = Math.max(1, ...topIds.map(id => Math.max(...series[id])));
  const W = 640, H = 220, padL = 34, padB = 24, padT = 12, padR = 12;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xAt = (i) => padL + (plotW * i) / (steps-1);
  const yAt = (v) => padT + plotH - (plotH * v) / maxVal;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padT + plotH * (1-f);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.round(maxVal*f)}</text>`;
  }).join('');

  const lines = topIds.map((id,ci) => {
    const pts = series[id].map((v,i)=> `${xAt(i)},${yAt(v)}`).join(' ');
    const color = colors[ci % colors.length];
    const lastX = xAt(series[id].length-1), lastY = yAt(series[id][series[id].length-1]);
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="${color}"/>`;
  }).join('');

  const legend = topIds.map((id,ci)=>{
    const color = colors[ci % colors.length];
    return `<span style="display:inline-flex;align-items:center;gap:5px;margin:3px 10px 3px 0;font-size:11.5px;color:var(--muted);">
      <span style="width:9px;height:9px;border-radius:50%;background:${color};display:inline-block;"></span>${esc(playerName(id))}
    </span>`;
  }).join('');

  return `<div class="card" style="margin-bottom:22px;">
    <div class="tourn-meta" style="margin-bottom:8px;">📈 Evolución del ranking (top 5, por torneo completado)</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${gridLines}${lines}</svg>
    <div style="margin-top:8px;">${legend}</div>
  </div>`;
}

function playerMetaShort(p){
  const bits = [];
  if(p.hand) bits.push(p.hand);

  return bits.join(' · ');
}

function podiumHtml(t, isDoubles){
  const nameOf = isDoubles ? (idx=> (t.pairs[idx]||[]).map(playerName).join(' / ')) : (pid=>playerName(pid));
  const rows = ['champion','finalist','semi','quarter'].filter(role => (t.results[role]||[]).length>0).map(role=>{
    const names = (t.results[role]||[]).map(nameOf).join(', ');
    return `<div class="podium-row"><span class="podium-role">${ROLE_LABELS[role]}</span><span>${esc(names)}</span></div>`;
  }).join('');
  return `<div class="podium">${rows}</div>`;
}

function viewStats(){
  const head = `<div class="section-head"><h2>Estadísticas generales</h2></div>
  <div class="section-sub">Números del circuito, calculados con los torneos cerrados y los marcadores que hayan cargado.</div>`;
  if(state.players.length===0){
    return head + `<div class="empty">Agrega jugadores para empezar a ver estadísticas.</div>`;
  }
  const completedSingles = state.tournaments.filter(t=>t.status==='completed').length;
  const completedDoubles = state.doubles.filter(t=>t.status==='completed').length;
  const totalMatches = state.tournaments.reduce((s,t)=>s+(t.matches||[]).length,0) + state.doubles.reduce((s,t)=>s+(t.matches||[]).length,0);
  let mostActive = null, mostActiveCount = -1;
  state.players.forEach(p=>{
    const c = tournamentsPlayedCount(p.id);
    if(c>mostActiveCount){ mostActiveCount = c; mostActive = p; }
  });

  const summary = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:26px;">
      <div class="card"><div class="tourn-meta">Torneos jugados</div><div class="disp" style="font-size:24px;color:var(--ball);">${completedSingles+completedDoubles}</div></div>
      <div class="card"><div class="tourn-meta">Partidos con marcador</div><div class="disp" style="font-size:24px;color:var(--ball);">${totalMatches}</div></div>
      <div class="card"><div class="tourn-meta">Jugador más activo</div><div class="disp" style="font-size:20px;color:var(--chalk);">${mostActiveCount>0?esc(mostActive.name):'—'}</div></div>
      <div class="card"><div class="tourn-meta">Jugadores en el circuito</div><div class="disp" style="font-size:24px;color:var(--ball);">${state.players.length}</div></div>
    </div>`;

  const withMatches = state.players.map(p=>({p, stat: playerMatchStats(p.id)})).filter(x=>x.stat.played>0)
    .sort((a,b)=>b.stat.pct-a.stat.pct);
  const withoutMatches = state.players.filter(p=>playerMatchStats(p.id).played===0);

  const rows = withMatches.map(({p,stat})=>`
    <div class="rank-row">
      <div class="rank-pos">${stat.pct}%</div>
      ${playerAvatarHtml(p,40)}
      <div class="rank-name-block">
        <span class="rank-name">${esc(p.name)}</span>
        <span class="rank-meta">${stat.played} partido(s) jugado(s) · ${stat.wins} ganado(s)</span>
      </div>
      <div class="rank-pts"><span class="num">${stat.wins}</span><span class="lbl">victorias</span></div>
    </div>`).join('');

  return head + summary +
    `<h3 style="font-size:18px;margin:6px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">% de victorias (individuales)</h3>
    ${rows || '<div class="empty">Nadie tiene partidos con marcador cargado todavía.</div>'}
    ${withoutMatches.length ? `<div class="tourn-meta" style="margin-top:14px;">Sin partidos registrados: ${withoutMatches.map(p=>esc(p.name)).join(', ')}</div>` : ''}`;
}

function openModal(html){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'ace-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  overlay.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeModal(); return; }
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){
      const primary = overlay.querySelector('.modal-actions .btn-primary, .modal-actions .btn-danger');
      if(primary){ e.preventDefault(); primary.click(); }
    }
  });
  document.getElementById('ace-app').appendChild(overlay);
  const firstField = overlay.querySelector('input[type=text], input[type=number], input[type=date], textarea, select');
  if(firstField) setTimeout(()=> firstField.focus(), 50);
}
function aceAlert(message){
  const existing = document.getElementById('ace-toast');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'ace-toast';
  toast.className = 'ace-toast';
  toast.textContent = message;
  document.getElementById('ace-app').appendChild(toast);
  setTimeout(()=>{ if(toast.parentNode) toast.remove(); }, 4200);
}
async function withLoading(btn, label, fn){
  if(!btn){ return fn(); }
  const original = btn.innerHTML;
  const wasDisabled = btn.disabled;
  btn.disabled = true;
  btn.innerHTML = `<span class="btn-spinner"></span> ${label}`;
  try {
    return await fn();
  } finally {
    if(btn.isConnected){ btn.disabled = wasDisabled; btn.innerHTML = original; }
  }
}
function confirmDialog(message){
  return new Promise(resolve=>{
    window.__acePendingConfirm = resolve;
    const html = `
      <h2>Confirmar</h2>
      <div class="section-sub" style="white-space:pre-line;">${esc(message)}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="AceApp.__resolveConfirm(false)">Cancelar</button>
        <button class="btn btn-danger" onclick="AceApp.__resolveConfirm(true)">Confirmar</button>
      </div>`;
    openModal(html);
  });
}
function __resolveConfirm(value){
  const resolve = window.__acePendingConfirm;
  window.__acePendingConfirm = null;
  closeModal();
  if(resolve) resolve(value);
}

function downloadBackup(){
  if(!state.isAdmin){ aceAlert('Solo el administrador puede descargar el respaldo.'); return; }
  const backup = {
    app: 'valle-grande-tour',
    version: 1,
    exportedAt: new Date().toISOString(),
    players: state.players,
    tournaments: state.tournaments,
    doubles: state.doubles,
    achievements: state.achievements,
    expenses: state.expenses,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `valle-grande-tour-respaldo-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function handleRestoreFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if(typeof data !== 'object' || data===null){ throw new Error('El archivo no tiene el formato esperado.'); }
    const summary = `Jugadores: ${(data.players||[]).length}, Torneos: ${(data.tournaments||[]).length}, Dobles: ${(data.doubles||[]).length}, Logros: ${(data.achievements||[]).length}, Gastos: ${(data.expenses||[]).length}`;
    if(!(await confirmDialog(`Esto reemplaza TODOS los datos actuales por los del respaldo:\n${summary}\n\n¿Continuar? Esta acción no se puede deshacer.`))) return;
    state.players = Array.isArray(data.players) ? data.players : [];
    state.tournaments = Array.isArray(data.tournaments) ? data.tournaments : [];
    state.doubles = Array.isArray(data.doubles) ? data.doubles : [];
    state.achievements = Array.isArray(data.achievements) ? data.achievements : [];
    state.expenses = Array.isArray(data.expenses) ? data.expenses : [];
    await save('players', state.players);
    await save('tournaments', state.tournaments);
    await save('doubles', state.doubles);
    await save('achievements', state.achievements);
    await save('expenses', state.expenses);
    render();
    aceAlert('Respaldo restaurado con éxito.');
  } catch(err){
    console.error('Error restaurando respaldo', err);
    aceAlert('No se pudo restaurar el respaldo: ' + (err && err.message ? err.message : err));
  }
}

async function saveBracketMatch(tid, isDoubles, rIdx, mIdx){
  const list = isDoubles ? state.doubles : state.tournaments;
  const t = list.find(x=>x.id===tid);
  const match = t.bracket[rIdx][mIdx];

  const winnerId = document.getElementById('bm-winner').value;
  if(!winnerId) { aceAlert('Por favor selecciona al ganador del partido.'); return; }

  const readSet = (aId, bId) => {
    const aEl = document.getElementById(aId);
    const bEl = document.getElementById(bId);
    if(!aEl || !bEl) return null;
    const a = aEl.value;
    const b = bEl.value;
    if(a==='' && b==='') return null;
    return [a===''?0:Number(a), b===''?0:Number(b)];
  };

  const sets = (state.matchRules.format === 'bestOf3'
    ? [readSet('bm-s1a','bm-s1b'), readSet('bm-s2a','bm-s2b'), readSet('bm-s3a','bm-s3b')]
    : [readSet('bm-s1a','bm-s1b')]
  ).filter(s => s !== null);

  const scoreLine = sets.map(s => `${s[0]}-${s[1]}`).join('   ');

  match.winner = winnerId;
  match.scoreLine = scoreLine;
  match.sets = sets; 

  const nextRIdx = rIdx + 1;
  
  if (nextRIdx < t.bracket.length) {
    const nextMIdx = Math.floor(mIdx / 2);
    const nextMatch = t.bracket[nextRIdx][nextMIdx];
    
    if (mIdx % 2 === 0) {
      nextMatch.p1 = winnerId;
    } else {
      nextMatch.p2 = winnerId;
    }
    
    if(nextMatch.winner !== winnerId) {
        nextMatch.winner = null;
        nextMatch.scoreLine = '';
        nextMatch.sets = [];
    }
  } else {
    const champion = winnerId;
    const finalist = match.p1 === winnerId ? match.p2 : match.p1;
    
    t.results.champion = [champion];
    t.results.finalist = finalist && finalist !== 'null' ? [finalist] : [];
    
    t.results.semi = [];
    if (rIdx >= 1) {
      t.bracket[rIdx - 1].forEach(m => {
        const loser = m.winner === m.p1 ? m.p2 : m.p1;
        if (loser && loser !== 'null') t.results.semi.push(loser);
      });
    }
    
    t.results.quarter = [];
    if (rIdx >= 2) {
      t.bracket[rIdx - 2].forEach(m => {
        const loser = m.winner === m.p1 ? m.p2 : m.p1;
        if (loser && loser !== 'null') t.results.quarter.push(loser);
      });
    }
    
    t.status = 'completed';
    aceAlert('🏆 ¡Torneo finalizado! Puntos repartidos al ranking.');
  }

  try {
    await save(isDoubles ? 'doubles' : 'tournaments', list);
    closeModal();
    render();
  } catch(e) {
    console.error(e);
    aceAlert('Hubo un error al guardar.');
  }
}

let cropState = null;
function handlePhoto(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){ openCropUI(img); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function openCropUI(img){
  const stage = 220;
  const baseScale = Math.max(stage/img.width, stage/img.height);
  const displayW = img.width*baseScale, displayH = img.height*baseScale;
  cropState = { img, stage, baseScale, zoom: 1, x: (stage-displayW)/2, y: (stage-displayH)/2 };
  const wrap = document.getElementById('photo-crop-wrap');
  wrap.innerHTML = `
    <div class="section-sub" style="margin:8px 0 6px;">Arrastra para mover, usa la barra para acercar/alejar.</div>
    <div id="crop-stage" style="width:${stage}px;height:${stage}px;border-radius:50%;overflow:hidden;position:relative;background:var(--court);cursor:grab;touch-action:none;border:2px solid var(--ball);">
      <img id="crop-img" src="${img.src}" style="position:absolute;left:${cropState.x}px;top:${cropState.y}px;width:${displayW}px;height:${displayH}px;max-width:none;user-select:none;">
    </div>
    <input type="range" id="crop-zoom" min="1" max="3" step="0.05" value="1" style="width:${stage}px;margin-top:8px;" oninput="AceApp.onCropZoom(this.value)">
    <div><button type="button" class="btn btn-ball btn-sm" style="margin-top:8px;" onclick="AceApp.applyCrop()">✅ Usar esta foto</button></div>`;
  setupCropDrag();
}
function clampCrop(){
  const displayW = cropState.img.width*cropState.baseScale*cropState.zoom;
  const displayH = cropState.img.height*cropState.baseScale*cropState.zoom;
  const minX = cropState.stage - displayW, minY = cropState.stage - displayH;
  cropState.x = Math.max(minX, Math.min(0, cropState.x));
  cropState.y = Math.max(minY, Math.min(0, cropState.y));
}
function setupCropDrag(){
  const stageEl = document.getElementById('crop-stage');
  const imgEl = document.getElementById('crop-img');
  if(!stageEl || !imgEl) return;
  let dragging=false, startPX=0, startPY=0, startX=0, startY=0;
  const getXY = (e)=> e.touches ? e.touches[0] : e;
  const onDown = (e)=>{
    dragging = true;
    const p = getXY(e);
    startPX=p.clientX; startPY=p.clientY; startX=cropState.x; startY=cropState.y;
    stageEl.style.cursor = 'grabbing';
  };
  const onMove = (e)=>{
    if(!dragging || !cropState || !document.body.contains(stageEl)) return;
    const p = getXY(e);
    cropState.x = startX + (p.clientX-startPX);
    cropState.y = startY + (p.clientY-startPY);
    clampCrop();
    imgEl.style.left = cropState.x+'px';
    imgEl.style.top = cropState.y+'px';
    if(e.cancelable) e.preventDefault();
  };
  const onUp = ()=>{ dragging=false; if(stageEl.isConnected) stageEl.style.cursor='grab'; };
  stageEl.addEventListener('mousedown', onDown);
  stageEl.addEventListener('touchstart', onDown, {passive:true});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}
function onCropZoom(val){
  if(!cropState) return;
  cropState.zoom = Number(val);
  clampCrop();
  const imgEl = document.getElementById('crop-img');
  if(imgEl){
    imgEl.style.width = (cropState.img.width*cropState.baseScale*cropState.zoom)+'px';
    imgEl.style.height = (cropState.img.height*cropState.baseScale*cropState.zoom)+'px';
    imgEl.style.left = cropState.x+'px';
    imgEl.style.top = cropState.y+'px';
  }
}
function applyCrop(){
  if(!cropState) return;
  const { img, stage, baseScale, zoom, x, y } = cropState;
  const displayScale = baseScale*zoom;
  const sourceSize = stage/displayScale;
  const sourceX = -x/displayScale, sourceY = -y/displayScale;
  const canvas = document.createElement('canvas');
  canvas.width = 260; canvas.height = 260;
  canvas.getContext('2d').drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, 260, 260);
  tempPhoto = canvas.toDataURL('image/jpeg', 0.85);
  document.getElementById('photo-preview').innerHTML = `<img class="avatar" style="width:64px;height:64px" src="${tempPhoto}">`;
  document.getElementById('photo-crop-wrap').innerHTML = '';
  cropState = null;
}

async function drawBracket(tid, isDoubles){
  if(!state.isAdmin){ aceAlert('Solo el administrador puede sortear el cuadro.'); return; }
  const list = isDoubles ? state.doubles : state.tournaments;
  const t = list.find(x=>x.id===tid);
  if(!t) return;

  const items = isDoubles ? t.pairs.map((_,idx)=>String(idx)) : [...t.participants];
  if(items.length < 2){ aceAlert('Necesitas al menos 2 inscritos para sortear.'); return; }
  if(t.bracket && t.bracket.length > 0 && !(await confirmDialog('Ya hay un cuadro sorteado. ¿Sortear de nuevo? (Se perderán los avances)'))) return;

  const shuffled = shuffleArray(items);
  const numPlayers = shuffled.length;
  const bracketSize = Math.pow(2, Math.ceil(Math.log2(numPlayers))); 
  const numMatchesR1 = bracketSize / 2;

  let round0 = [];
  for(let i=0; i<numMatchesR1; i++) {
    round0.push({ p1: null, p2: null, winner: null, scoreLine: '' });
  }

  for(let i=0; i<numPlayers; i++) {
    let matchIdx = i % numMatchesR1;
    if(!round0[matchIdx].p1) round0[matchIdx].p1 = shuffled[i];
    else round0[matchIdx].p2 = shuffled[i];
  }

  round0.forEach(m => {
    if(!m.p2) m.winner = m.p1;
  });

  let rounds = [round0];
  let currentSize = numMatchesR1;
  let rIdx = 1;

  while(currentSize > 1) {
    currentSize = currentSize / 2;
    let round = [];
    for(let i=0; i<currentSize; i++) {
      const prev1 = rounds[rIdx-1][i*2];
      const prev2 = rounds[rIdx-1][i*2+1];
      round.push({
        p1: prev1.winner || null,
        p2: prev2.winner || null,
        winner: null,
        scoreLine: ''
      });
    }
    rounds.push(round);
    rIdx++;
  }

  t.bracket = rounds;
  await save(isDoubles ? 'doubles' : 'tournaments', list);
  render();
}

  state.achievements = state.achievements.filter(a=>a.id!==id);

async function togglePaid(type, tid, key){
  if(!state.isAdmin) return;
  const list = type==='singles' ? state.tournaments : state.doubles;
  const t = list.find(x=>x.id===tid);
  if(!t) return;
  t.paid = t.paid || [];
  const idx = t.paid.indexOf(key);
  if(idx>=0) t.paid.splice(idx,1);
  else t.paid.push(key);
  await save(type==='singles'?'tournaments':'doubles', list);
  render();
}
async function markAllPaid(type, tid, markValue){
  if(!state.isAdmin) return;
  const list = type==='singles' ? state.tournaments : state.doubles;
  const t = list.find(x=>x.id===tid);
  if(!t) return;
  if(type==='singles'){
    t.paid = markValue ? [...t.participants] : [];
  } else {
    t.paid = markValue ? t.pairs.map((_,i)=>String(i)) : [];
  }
  await save(type==='singles'?'tournaments':'doubles', list);
  render();
}

async function saveBracketMatch(tid, isDoubles, rIdx, mIdx){
  const list = isDoubles ? state.doubles : state.tournaments;
  const t = list.find(x=>x.id===tid);
  const match = t.bracket[rIdx][mIdx];

  const winnerId = document.getElementById('bm-winner').value;
  if(!winnerId) { aceAlert('Por favor selecciona al ganador del partido.'); return; }

  const readSet = (aId, bId) => {
    const aEl = document.getElementById(aId);
    const bEl = document.getElementById(bId);
    if(!aEl || !bEl) return null;
    const a = aEl.value;
    const b = bEl.value;
    if(a==='' && b==='') return null;
    return [a===''?0:Number(a), b===''?0:Number(b)];
  };

  const sets = (state.matchRules.format === 'bestOf3'
    ? [readSet('bm-s1a','bm-s1b'), readSet('bm-s2a','bm-s2b'), readSet('bm-s3a','bm-s3b')]
    : [readSet('bm-s1a','bm-s1b')]
  ).filter(s => s !== null);

  const scoreLine = sets.map(s => `${s[0]}-${s[1]}`).join('   ');

  match.winner = winnerId;
  match.scoreLine = scoreLine;
  match.sets = sets; 

  const nextRIdx = rIdx + 1;
  
  if (nextRIdx < t.bracket.length) {
    const nextMIdx = Math.floor(mIdx / 2);
    const nextMatch = t.bracket[nextRIdx][nextMIdx];
    
    if (mIdx % 2 === 0) {
      nextMatch.p1 = winnerId;
    } else {
      nextMatch.p2 = winnerId;
    }
    
    if(nextMatch.winner !== winnerId) {
        nextMatch.winner = null;
        nextMatch.scoreLine = '';
        nextMatch.sets = [];
    }
  } else {
    const champion = winnerId;
    const finalist = match.p1 === winnerId ? match.p2 : match.p1;
    
    t.results.champion = [champion];
    t.results.finalist = finalist && finalist !== 'null' ? [finalist] : [];
    
    t.results.semi = [];
    if (rIdx >= 1) {
      t.bracket[rIdx - 1].forEach(m => {
        const loser = m.winner === m.p1 ? m.p2 : m.p1;
        if (loser && loser !== 'null') t.results.semi.push(loser);
      });
    }
    
    t.results.quarter = [];
    if (rIdx >= 2) {
      t.bracket[rIdx - 2].forEach(m => {
        const loser = m.winner === m.p1 ? m.p2 : m.p1;
        if (loser && loser !== 'null') t.results.quarter.push(loser);
      });
    }
    
    t.status = 'completed';
    aceAlert('🏆 ¡Torneo finalizado! Puntos repartidos al ranking.');
  }

  try {
    await save(isDoubles ? 'doubles' : 'tournaments', list);
    closeModal();
    render();
  } catch(e) {
    console.error(e);
    aceAlert('Hubo un error al guardar.');
  }
}
