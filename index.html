  modoZen:         { e:'🧘',  t:'Modo Zen',           d:'Mantuvo su tasa de errores no forzados bajo el 10% durante todo un partido (mín. 10 puntos).', tier:'gold',
    progress:{ get:a=> a.matchMin.unfErrorRate===Infinity ? 0 : Math.max(0, 1-(a.matchMin.unfErrorRate/0.10)), target:1, isRatio:true,
      fmt:a2=> a2.matchMin.unfErrorRate===Infinity ? 'Todavía sin un partido con 10+ puntos' : `Tu mejor partido: ${Math.round(a2.matchMin.unfErrorRate*100)}% de errores no forzados (meta: bajo 10%)` } },
  fenix:           { e:'🐦‍🔥', t:'Fénix',              d:'Metió un winner o ace justo después de 2 o más errores no forzados seguidos.', tier:'gold' },
  dominioTotal:    { e:'⚔️',  t:'Dominio Total',      d:'Terminó un partido con más aces + winners que errores no forzados.', tier:'gold' },
  intocable:       { e:'🧱',  t:'Intocable',          d:'Ganó un juego completo solo con aces y winners.', tier:'gold' },
  festivalHits:    { e:'🏹',  t:'Festival de Hits',   d:'Superó los 30 puntos de mérito propio (aces + winners) en un partido.', tier:'gold',
    progress:{ get:a=>a.matchMax.aceWinnerSum, target:30, fmt:v=>`${v}/30 aces+winners en un partido (mejor)` } }
};
const ACH_TIER_LABEL = { bronze:'🥉 Bronce', silver:'🥈 Plata', gold:'🥇 Oro' };

function allUmpiredSinglesMatches(){
  const out = [];
  (state.casualMatches||[]).forEach(m=>{ if(m.liveStats && m.mode!=='doubles') out.push({...m, _date:m.date||'', _label:'Partido libre'}); });
  (state.tournaments||[]).forEach(t=>{ (t.bracket||[]).forEach(round=>round.forEach(m=>{ if(m.liveStats) out.push({...m, _date:t.date||'', _label:t.name}); })); });
  return out;
}
function allUmpiredDoublesMatches(){
  const out = [];
  (state.casualMatches||[]).forEach(m=>{ if(m.liveStats && m.mode==='doubles') out.push({...m, _date:m.date||'', _label:'Partido libre'}); });
  (state.doubles||[]).forEach(t=>{ (t.bracket||[]).forEach(round=>round.forEach(m=>{ if(m.liveStats) out.push({...m, _date:t.date||'', _label:t.name}); })); });
  return out;
}
function sortByDateAsc(matches){
  return matches.slice().sort((a,b)=> (a._date||'9999-99-99').localeCompare(b._date||'9999-99-99'));
}
// Identificador estable de una pareja de dobles, sin importar el orden en que
// se guardaron los dos jugadores ni en qué torneo jugaron juntos.
function pairKeyOf(ids){
  return [...ids].sort((a,b)=> playerName(a).localeCompare(playerName(b))).join('|');
}
function pairLabel(key){
  return key.split('|').map(playerName).join(' / ');
}

function groupPointsByGame(pointLog){
  const map = new Map();
  (pointLog||[]).forEach(pt=>{
    const key = pt.setIndex+'_'+pt.gameIndex;
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(pt);
  });
  return map;
}
function gameWinnerMap(gameLog){
  const map = new Map();
  (gameLog||[]).forEach(g=> map.set(g.setIndex+'_'+g.gameIndex, g));
  return map;
}

// Calcula rachas (máximas Y actuales/finales) + logros desbloqueados por UN lado (A/B) en UN partido
function computeSideMatchStats(liveStats, side){
  const pointLog = liveStats.pointLog || [];
  const gLog = liveStats.gameLog || [];
  const stats = (liveStats.stats && liveStats.stats[side]) ? liveStats.stats[side] : {ace:0,winner:0,unfError:0};

  const cur = { point:0, ace:0, winnerS:0, cleanKill:0, lost:0, cleanRun:0, serveEff:0 };
  const max = { point:0, ace:0, winnerS:0, cleanKill:0, lost:0, cleanRun:0, serveEff:0 };
  let ownErrorStreak = 0;
  const unlocked = {};

  pointLog.forEach(pt=>{
    const wonByMe = pt.side === side;
    const isOwnError = (!wonByMe && pt.type==='error');
    const prevLost = cur.lost; // valor ANTES de actualizar este punto

    cur.point = wonByMe ? cur.point+1 : 0;               max.point = Math.max(max.point, cur.point);
    cur.lost  = wonByMe ? 0 : cur.lost+1;                 max.lost  = Math.max(max.lost, cur.lost);
    cur.ace   = (wonByMe && pt.type==='ace') ? cur.ace+1 : 0;         max.ace = Math.max(max.ace, cur.ace);
    cur.winnerS = (wonByMe && pt.type==='winner') ? cur.winnerS+1 : 0; max.winnerS = Math.max(max.winnerS, cur.winnerS);
    cur.cleanKill = (wonByMe && (pt.type==='ace'||pt.type==='winner')) ? cur.cleanKill+1 : 0;
    max.cleanKill = Math.max(max.cleanKill, cur.cleanKill);
    cur.cleanRun = isOwnError ? 0 : cur.cleanRun+1;       max.cleanRun = Math.max(max.cleanRun, cur.cleanRun);
    const servingMe = pt.server === side;
    cur.serveEff = (servingMe && wonByMe) ? cur.serveEff+1 : (servingMe ? 0 : cur.serveEff);
    max.serveEff = Math.max(max.serveEff, cur.serveEff);

    if (wonByMe && (pt.type==='ace'||pt.type==='winner') && ownErrorStreak>=2) unlocked.fenix = true;
    if (wonByMe && (pt.type==='ace'||pt.type==='winner') && prevLost>=4) unlocked.rompeRachas = true;

    ownErrorStreak = isOwnError ? ownErrorStreak+1 : 0;
  });

  // Inapelable: winner justo después de un ace (mismos puntos consecutivos)
  for(let i=1;i<pointLog.length;i++){
    if(pointLog[i].side===side && pointLog[i].type==='winner' && pointLog[i-1].side===side && pointLog[i-1].type==='ace'){
      unlocked.inapelable = true; break;
    }
  }

  // Logros por juego: bombardero / intocable / juegoPerfecto / sangreFria
  const byGame = groupPointsByGame(pointLog);
  const gWinners = gameWinnerMap(gLog);
  byGame.forEach((pts, key)=>{
    const mine = pts.filter(p=>p.side===side);
    const myAces = mine.filter(p=>p.type==='ace').length;
    if(myAces>=3) unlocked.bombardero = true;

    const gInfo = gWinners.get(key);
    const wonThisGame = gInfo && gInfo.winner===side;
    if(wonThisGame && mine.length>0 && mine.every(p=>p.type==='ace'||p.type==='winner')) unlocked.intocable = true;

    const myOwnErrorsInGame = pts.filter(p=>p.side!==side && p.type==='error').length;
    if(wonThisGame && myOwnErrorsInGame===0) unlocked.juegoPerfecto = true;

    // Sangre fría: gano el último punto del juego con ace/winner Y el juego fue un quiebre (gané sacando el rival)
    if(wonThisGame && gInfo && gInfo.server!==side && pts.length>0){
      const lastPt = pts[pts.length-1];
      if(lastPt.side===side && (lastPt.type==='ace'||lastPt.type==='winner')) unlocked.sangreFria = true;
    }
  });

  if(stats.winner>=10) unlocked.lluviaGanadores = true;
  if(max.cleanRun>=15) unlocked.paredConcreto = true;
  const unfErrorRate = pointLog.length>0 ? stats.unfError/pointLog.length : Infinity;
  if(pointLog.length>=10 && unfErrorRate < 0.10) unlocked.modoZen = true;
  if((stats.ace+stats.winner) > stats.unfError && (stats.ace+stats.winner)>0) unlocked.dominioTotal = true;
  const normalTotal = pointLog.filter(p=>p.type==='normal').length;
  const normalMine = pointLog.filter(p=>p.type==='normal' && p.side===side).length;
  if(normalTotal>=5 && (normalMine/normalTotal)>=0.70) unlocked.puntoAPunto = true;
  if((stats.ace+stats.winner)>=30) unlocked.festivalHits = true;

  // Games de saque: servidos, mantenidos, quiebres logrados/sufridos
  let servedGames=0, heldGames=0, breaksAchieved=0, breaksSuffered=0;
  gLog.forEach(g=>{
    if(g.server===side){ servedGames++; if(g.winner===side) heldGames++; else breaksSuffered++; }
    else { if(g.winner===side) breaksAchieved++; }
  });

  return {
    ace: stats.ace, winner: stats.winner, unfError: stats.unfError,
    pointsPlayed: pointLog.length,
    pointsWon: pointLog.filter(p=>p.side===side).length,
    normalWon: normalMine, normalTotal,
    max, cur, unfErrorRate,
    servedGames, heldGames, breaksAchieved, breaksSuffered,
    unlocked
  };
}

// Esqueleto vacío de acumulado (mismo shape que usa accumulatePlayerFromSide). Se usa
// para poder pintar el catálogo completo de logros como "bloqueados" cuando un jugador
// o pareja todavía no tiene ningún partido arbitrado, en vez de esconder la sección.
function emptyAggShape(){
  return {
    ace:0, winner:0, unfError:0, pointsPlayed:0, pointsWon:0, normalWon:0, normalTotal:0,
    servedGames:0, heldGames:0, breaksAchieved:0, breaksSuffered:0,
    matchesUmpired:0,
    max: { point:0, ace:0, winnerS:0, cleanKill:0, lost:0, cleanRun:0, serveEff:0 },
    matchMax: { ace:0, winner:0, aceWinnerSum:0 },
    matchMin: { unfErrorRate: Infinity },
    unlocked: {},
    unlockEvents: {},
    lastMatch: null
  };
}

// Combina las stats de un partido (por lado) en el acumulado de cada jugador/pareja participante
function accumulatePlayerFromSide(agg, id, sideStats){
  if(!agg[id]) agg[id] = emptyAggShape();
  const a = agg[id];
  a.ace += sideStats.ace; a.winner += sideStats.winner; a.unfError += sideStats.unfError;
  a.pointsPlayed += sideStats.pointsPlayed; a.pointsWon += sideStats.pointsWon;
  a.normalWon += sideStats.normalWon; a.normalTotal += sideStats.normalTotal;
  a.servedGames += sideStats.servedGames; a.heldGames += sideStats.heldGames;
  a.breaksAchieved += sideStats.breaksAchieved; a.breaksSuffered += sideStats.breaksSuffered;
  a.matchesUmpired += 1;
  Object.keys(a.max).forEach(k=>{ a.max[k] = Math.max(a.max[k], sideStats.max[k]); });
  a.matchMax.ace = Math.max(a.matchMax.ace, sideStats.ace);
  a.matchMax.winner = Math.max(a.matchMax.winner, sideStats.winner);
  a.matchMax.aceWinnerSum = Math.max(a.matchMax.aceWinnerSum, sideStats.ace+sideStats.winner);
  if(sideStats.pointsPlayed>=10) a.matchMin.unfErrorRate = Math.min(a.matchMin.unfErrorRate, sideStats.unfErrorRate);
  Object.keys(sideStats.unlocked).forEach(k=>{ if(sideStats.unlocked[k]) a.unlocked[k] = true; });
  return a;
}

// Acumula un partido Y deja registro de fecha/torneo del primer partido donde
// se desbloqueó cada logro, además de la racha "en caliente" del último partido jugado.
function accumulateWithMeta(agg, id, sideStats, matchMeta){
  const before = agg[id] ? {...agg[id].unlocked} : {};
  const a = accumulatePlayerFromSide(agg, id, sideStats);
  Object.keys(a.unlocked).forEach(k=>{
    if(a.unlocked[k] && !before[k] && !a.unlockEvents[k]){
      a.unlockEvents[k] = { date: matchMeta._date||'', label: matchMeta._label||'' };
    }
  });
  a.lastMatch = { cur: sideStats.cur, date: matchMeta._date||'', label: matchMeta._label||'' };
}

// Recorre TODOS los partidos de SINGLES arbitrados (en orden cronológico) y
// arma el acumulado por jugador. Los partidos de dobles NUNCA entran acá.
function playerUmpireStats(){
  const agg = {};
  sortByDateAsc(allUmpiredSinglesMatches()).forEach(m=>{
    const ls = m.liveStats;
    const sideA = computeSideMatchStats(ls, 'A');
    const sideB = computeSideMatchStats(ls, 'B');
    (ls.participantsA||[]).forEach(pid=> accumulateWithMeta(agg, pid, sideA, m));
    (ls.participantsB||[]).forEach(pid=> accumulateWithMeta(agg, pid, sideB, m));
  });
  return agg;
}

// ---------- RADAR DE ATRIBUTOS (Saque, Volea, Resistencia, Mentalidad, Defensa) ----------
// Calculado 100% a partir de las estadísticas reales acumuladas por el módulo umpire
// (playerUmpireStats), sin depender de otros jugadores, para que funcione desde el
// primer partido arbitrado.
function clampNum(v, min, max){ return Math.max(min, Math.min(max, v)); }
function computePlayerAttributes(playerId){
  const agg = playerUmpireStats()[playerId];
  if(!agg || !agg.matchesUmpired) return null;

  // Saque: combina % de games de servicio retenidos + tasa de aces por game servido.
  const aceRate = agg.servedGames>0 ? agg.ace/agg.servedGames : 0;
  const holdRate = agg.servedGames>0 ? agg.heldGames/agg.servedGames : 0;
  const saque = clampNum(holdRate*70 + clampNum(aceRate,0,1)*30, 0, 100);

  // Volea (ataque/definición de punto): tasa de winners sobre puntos jugados.
  const winnerRate = agg.pointsPlayed>0 ? agg.winner/agg.pointsPlayed : 0;
  const volea = clampNum((winnerRate/0.25)*100, 0, 100);

  // Resistencia: promedio de puntos jugados por partido (aguante en partidos largos).
  const avgPtsPerMatch = agg.matchesUmpired>0 ? agg.pointsPlayed/agg.matchesUmpired : 0;
  const resistencia = clampNum((avgPtsPerMatch/40)*100, 0, 100);

  // Mentalidad: pocos errores no forzados + capacidad de sostener el propio servicio
  // bajo presión (no ser quebrado seguido).
  const unfErrorRate = agg.pointsPlayed>0 ? agg.unfError/agg.pointsPlayed : 0;
  const holdUnderPressure = agg.servedGames>0 ? 1-(agg.breaksSuffered/agg.servedGames) : 0.5;
  const mentalidad = clampNum((1-clampNum(unfErrorRate,0,1))*50 + clampNum(holdUnderPressure,0,1)*50, 0, 100);

  // Defensa: efectividad ganando puntos "normales" (rallies sin ace/winner/error), o sea
  // solidez de fondo de cancha sin depender de golpes ganadores.
  const defensa = agg.normalTotal>0 ? clampNum((agg.normalWon/agg.normalTotal)*100, 0, 100) : 0;

  return [
    { key:'saque', label:'Saque', value: Math.round(saque) },
    { key:'volea', label:'Volea', value: Math.round(volea) },
    { key:'resistencia', label:'Resistencia', value: Math.round(resistencia) },
    { key:'mentalidad', label:'Mentalidad', value: Math.round(mentalidad) },
    { key:'defensa', label:'Defensa', value: Math.round(defensa) },
  ];
}
// Genera un gráfico de radar (pentagonal) en SVG puro a partir de una lista de
// {label, value} con value en 0-100. Sin librerías externas.
function radarChartSvg(attrs, opts){
  opts = opts || {};
  const size = opts.size || 260;
  const cx = size/2, cy = size/2;
  const radius = size/2 - 46;
  const n = attrs.length;
  const angleStep = (Math.PI*2)/n;
  const startAngle = -Math.PI/2;
  const pointAt = (i, pct) => {
    const angle = startAngle + i*angleStep;
    const r = radius * (pct/100);
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  };
  const rings = [20,40,60,80,100];
  const ringPolys = rings.map(r=>{
    const pts = attrs.map((_,i)=>pointAt(i, r).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const axisLines = attrs.map((_,i)=>{
    const [x,y] = pointAt(i,100);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const dataPts = attrs.map((a,i)=>pointAt(i, a.value).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots = attrs.map((a,i)=>{
    const [x,y] = pointAt(i,a.value);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--ball)"/>`;
  }).join('');
  const labels = attrs.map((a,i)=>{
    const angle = startAngle + i*angleStep;
    const lr = radius + 30;
    const x = cx + lr*Math.cos(angle);
    const y = cy + lr*Math.sin(angle);
    const cosA = Math.cos(angle);
    const anchor = Math.abs(cosA)<0.3 ? 'middle' : (cosA>0 ? 'start' : 'end');
    return `<text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="var(--chalk)">${esc(a.label)}</text>
      <text x="${x.toFixed(1)}" y="${(y+11).toFixed(1)}" text-anchor="${anchor}" font-size="10" fill="var(--ball)">${a.value}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}" style="max-width:300px;display:block;margin:0 auto;overflow:visible;">
    ${ringPolys}
    ${axisLines}
    <polygon points="${dataPts}" fill="var(--ball)" fill-opacity="0.25" stroke="var(--ball)" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}
// Tarjeta lista para insertar: título + radar (o mensaje si aún no hay datos).
function radarCardHtml(playerId){
  const attrs = computePlayerAttributes(playerId);
  if(!attrs){
    return `<div class="card radar-card" style="margin-bottom:14px;">
      <strong>🕸️ Radar de atributos</strong>
      <div class="tourn-meta" style="margin-top:8px;">Arbitra al menos un partido de singles en vivo para generar tu radar (Saque, Volea, Resistencia, Mentalidad, Defensa).</div>
    </div>`;
  }
  return `<div class="card radar-card" style="margin-bottom:14px;">
    <strong style="display:block;margin-bottom:2px;">🕸️ Radar de atributos</strong>
    <div class="tourn-meta">Calculado en base a tus partidos de singles arbitrados en vivo.</div>
    ${radarChartSvg(attrs)}
  </div>`;
}

// Recorre TODOS los partidos de DOBLES arbitrados (en orden cronológico) y
// arma el acumulado por PAREJA (no por jugador individual).
function pairUmpireStats(){
  const agg = {};
  sortByDateAsc(allUmpiredDoublesMatches()).forEach(m=>{
    const ls = m.liveStats;
    const sideA = computeSideMatchStats(ls, 'A');
    const sideB = computeSideMatchStats(ls, 'B');
    if((ls.participantsA||[]).length===2) accumulateWithMeta(agg, pairKeyOf(ls.participantsA), sideA, m);
    if((ls.participantsB||[]).length===2) accumulateWithMeta(agg, pairKeyOf(ls.participantsB), sideB, m);
  });
  return agg;
}

function playerProfileAchievements(playerId){
  const agg = playerUmpireStats()[playerId];
  if(!agg) return [];
  return Object.keys(agg.unlocked).filter(k=>agg.unlocked[k]).map(k=>({key:k, ...PROFILE_ACHIEVEMENTS_DEF[k]})).filter(x=>x.t);
}
function pairProfileAchievements(pairKey){
  const agg = pairUmpireStats()[pairKey];
  if(!agg) return [];
  return Object.keys(agg.unlocked).filter(k=>agg.unlocked[k]).map(k=>({key:k, ...PROFILE_ACHIEVEMENTS_DEF[k]})).filter(x=>x.t);
}

// "Casi lo logras": el logro bloqueado con progreso más alto (solo entre los
// que tienen una métrica de progreso definida).
function nearestLockedAchievement(agg){
  if(!agg) return null;
  let best = null;
  Object.keys(PROFILE_ACHIEVEMENTS_DEF).forEach(key=>{
    if(agg.unlocked[key]) return;
    const def = PROFILE_ACHIEVEMENTS_DEF[key];
    if(!def.progress) return;
    const val = def.progress.get(agg);
    const pct = def.progress.isRatio ? Math.min(1,val) : Math.min(1, val/def.progress.target);
    if(!best || pct>best.pct) best = { key, def, pct, text: def.progress.fmt(def.progress.isRatio?agg:val) };
  });
  return best;
}

function fmtAchDate(iso){
  if(!iso) return '';
  try{ return new Date(iso+'T00:00:00').toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return iso; }
}

    direction:'max', value:a=>a.winner, fmt:v=>`${v} winner(s)` },
  { key:'minimoEsfuerzo', e:'⚡', t:'La Ley del Mínimo Esfuerzo', category:'power', d:'Mayor % de puntos ganados de forma directa (aces + winners sobre puntos ganados). Mín. 8 puntos ganados.',
    direction:'max', minPointsWon:8, value:a=> a.pointsWon>0 ? (a.ace+a.winner)/a.pointsWon : null, fmt:v=>`${Math.round(v*100)}%` },
  { key:'muralla', e:'🧱', t:'La Muralla de Concreto', category:'defense', d:'Menor promedio de errores no forzados por partido. Mín. 3 partidos arbitrados.',
    direction:'min', minMatches:3, value:a=> a.unfError/a.matchesUmpired, fmt:v=>`${v.toFixed(1)} err/partido` },
  { key:'guanteBlanco', e:'🥊', t:'El Guante Blanco', category:'defense', d:'Mayor ratio de dominio: (aces + winners) sobre errores no forzados.',
    direction:'max', minMatches:1, value:a=> a.unfError>0 ? (a.ace+a.winner)/a.unfError : (a.ace+a.winner>0 ? 999 : null), fmt:v=> v>=999?'∞':v.toFixed(2) },
  { key:'peloteo', e:'🌾', t:'El Rey del Peloteo', category:'defense', d:'Más puntos normales ganados (sin apoyarse en aces ni winners).',
    direction:'max', value:a=>a.normalWon, fmt:v=>`${v} punto(s)` },
  { key:'inquebrantable', e:'🔒', t:'Inquebrantable', category:'serve', d:'Mayor % de games de saque mantenidos. Mín. 5 games de saque.',
    direction:'max', minServed:5, value:a=> a.servedGames>0 ? a.heldGames/a.servedGames : null, fmt:v=>`${Math.round(v*100)}%` },
  { key:'pirata', e:'🏴‍☠️', t:'El Pirata', category:'serve', d:'Más quiebres de servicio logrados.',
    direction:'max', value:a=>a.breaksAchieved, fmt:v=>`${v} quiebre(s)` },
  { key:'manosMantequilla', e:'🧈', t:'Manos de Mantequilla', category:'shame', d:'Más errores no forzados acumulados en el torneo. (Hall of Shame)',
    direction:'max', value:a=>a.unfError, fmt:v=>`${v} error(es)` },
  { key:'regadera', e:'🚿', t:'La Regadera / Mister "Casi"', category:'shame', d:'Más errores no forzados cometidos en un solo partido. (Hall of Shame)',
    direction:'max', perMatch:true, value:sideStats=>sideStats.unfError, fmt:v=>`${v} error(es) en un partido` }
];

function computeLeagueTitlesFor(agg, matchesList){
  const results = [];
  LEAGUE_TITLES_DEF.filter(d=>!d.perMatch).forEach(def=>{
    const ranked = [];
    Object.keys(agg).forEach(id=>{
      const a = agg[id];
      if(def.minMatches && a.matchesUmpired < def.minMatches) return;
      if(def.minServed && a.servedGames < def.minServed) return;
      if(def.minPointsWon && a.pointsWon < def.minPointsWon) return;
      const v = def.value(a);
      if(v===null || v===undefined || isNaN(v) || v<=0) return;
      ranked.push({ id, v });
    });
    ranked.sort((x,y)=> def.direction==='min' ? x.v-y.v : y.v-x.v);
    if(ranked.length===0){
      // Nadie califica todavía: igual mostramos el título como "sin dueño" para que
      // se pueda ver y motive a perseguirlo, en vez de esconderlo por completo.
      results.push({
        key:def.key, e:def.e, t:def.t, d:def.d, category:def.category,
        holderId:null, value:null, display:null,
        runnerUpId:null, runnerUpValue:null, runnerUpDisplay:null,
        direction: def.direction, fmt: def.fmt
      });
      return;
    }
    const winner = ranked[0], runnerUp = ranked[1] || null;
    results.push({
      key:def.key, e:def.e, t:def.t, d:def.d, category:def.category,
      holderId:winner.id, value:winner.v, display:def.fmt(winner.v),
      runnerUpId: runnerUp ? runnerUp.id : null,
      runnerUpValue: runnerUp ? runnerUp.v : null,
      runnerUpDisplay: runnerUp ? def.fmt(runnerUp.v) : null,
      direction: def.direction, fmt: def.fmt
    });
  });

  // "La Regadera": el peor partido individual (no un acumulado, así que se recorre distinto)
  const regaderaDef = LEAGUE_TITLES_DEF.find(d=>d.key==='regadera');
  let worstId=null, worstVal=0;
  matchesList.forEach(m=>{
    const ls = m.liveStats;
    ['A','B'].forEach(side=>{
      const s = computeSideMatchStats(ls, side);
      const parts = side==='A' ? ls.participantsA : ls.participantsB;
      if(!parts || parts.length===0) return;
      const id = parts.length===2 ? pairKeyOf(parts) : parts[0];
      if(s.unfError > worstVal){ worstVal = s.unfError; worstId = id; }
    });
  });
  if(worstId!==null && worstVal>0){
    results.push({ key:regaderaDef.key, e:regaderaDef.e, t:regaderaDef.t, d:regaderaDef.d, category:regaderaDef.category, holderId:worstId, value:worstVal, display:regaderaDef.fmt(worstVal), runnerUpId:null });
  } else {
    results.push({ key:regaderaDef.key, e:regaderaDef.e, t:regaderaDef.t, d:regaderaDef.d, category:regaderaDef.category, holderId:null, value:null, display:null, runnerUpId:null });
  }
  return results;
}

// ---------- GOAT · Singles y GOAT · Dobles (por puntos totales de ranking) ----------
// Título especial, separado del motor de rachas/umpire: se basa en los puntos de
// ranking (games ganados en torneos + partidos libres), igual que el resto del circuito.
// Se calcula por separado para singles (por jugador) y dobles (por PAREJA como equipo),
// y se inyecta como un título más dentro de su categoría 'goat' para que aparezca en la
// grilla de títulos de cada subcategoría y también en "Mi perfil".
function goatTitleFromPoints(pts, key, title, desc){
  const ranked = Object.keys(pts).map(id=>({id, v:pts[id]})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const base = { key, e:'🐐', t:title, d:desc, category:'goat', direction:'max', fmt:v=>`${v} pts` };
  if(ranked.length===0){
    return { ...base, holderId:null, value:null, display:null, runnerUpId:null, runnerUpValue:null, runnerUpDisplay:null };
  }
  const winner = ranked[0], runnerUp = ranked[1] || null;
  return { ...base, holderId:winner.id, value:winner.v, display:`${winner.v} pts`,
    runnerUpId: runnerUp ? runnerUp.id : null,
    runnerUpValue: runnerUp ? runnerUp.v : null,
    runnerUpDisplay: runnerUp ? `${runnerUp.v} pts` : null };
}
function computeSinglesGoatTitle(){
  return goatTitleFromPoints(singlesPointsByPlayer(), 'goatSingles', 'El GOAT · Singles',
    'El jugador con más puntos totales acumulados en singles (suma de games ganados en torneos y partidos libres).');
}
function computeDoublesGoatTitle(){
  return goatTitleFromPoints(doublesPointsByPairMap(), 'goatDoubles', 'El GOAT · Dobles',
    'La pareja con más puntos totales acumulados jugando junta en dobles (suma de games ganados en torneos y partidos libres).');
}
function computeLeagueTitles(){ return [computeSinglesGoatTitle(), ...computeLeagueTitlesFor(playerUmpireStats(), allUmpiredSinglesMatches())]; }
function computePairLeagueTitles(){ return [computeDoublesGoatTitle(), ...computeLeagueTitlesFor(pairUmpireStats(), allUmpiredDoublesMatches())]; }

// ---------- Sub-módulo: Logros Dobles ----------
function renderDoublesAchSubtab(){
  const umpiredCount = allUmpiredDoublesMatches().length;
  const cat = state.achCategory || 'all';
  const search = (state.achSearch||'').trim().toLowerCase();
  let titles = computePairLeagueTitles();
  if(cat!=='all') titles = titles.filter(t=>t.category===cat);
  if(search) titles = titles.filter(t=> t.holderId && pairLabel(t.holderId).toLowerCase().includes(search));

  const agg = pairUmpireStats();
  let keys = Object.keys(agg);
  if(search) keys = keys.filter(k=> pairLabel(k).toLowerCase().includes(search));

  return `
    <div class="section-sub" style="margin-top:-2px;">Se premia a la PAREJA como equipo, nunca a un jugador suelto — el umpire no distingue quién de los dos tocó cada pelota. Nunca se mezcla con las estadísticas de singles.</div>
    <h3 style="font-size:16px;margin:14px 0 4px;color:var(--chalk);">Títulos de liga · Dobles (se roban 👑)</h3>
    <div class="section-sub" style="margin-top:-4px;">Incluye el 🐐 GOAT de Dobles (puntos totales que la pareja acumuló jugando junta) y los títulos calculados por umpire. Se muestran todos, aunque todavía nadie los tenga.</div>
    ${achChipsHtml(cat)}
    ${achSearchHtml(state.achSearch||'', 'Buscar pareja…')}
    ${umpiredCount===0 ? `<div class="tourn-meta" style="margin-bottom:10px;">💡 Todavía no hay partidos de dobles arbitrados en vivo con estadísticas. Usa "🔴 Arbitrar en vivo" en un partido de dobles para empezar a repartir los títulos calculados por umpire.</div>` : ''}
    ${titlesGridHtml(titles, pairLabel)}
    <h3 style="font-size:16px;margin:26px 0 4px;color:var(--chalk);">Insignias de umpire · Dobles</h3>
    ${umpiredCount===0
      ? `<div class="empty">Arbitra un partido de dobles en vivo para empezar a desbloquear rachas e insignias de pareja.</div>`
      : (keys.length ? keys.map(key=>entityBadgeCardHtml(`<strong>${esc(pairLabel(key))}</strong>`, agg[key], pairProfileAchievements(key))).join('')
        : `<div class="empty">Sin resultados para ese filtro.</div>`)}
  `;
}

// ---------- Sub-módulo: Mi Perfil ----------
function renderMiPerfilSingles(playerId){
  const real = playerUmpireStats()[playerId];
  const hasData = !!real;
  const agg = real || emptyAggShape();
  const intro = hasData ? '' : `<div class="empty" style="margin-bottom:14px;">Todavía no tienes partidos de singles arbitrados. Cuando arbitren uno en vivo, tus rachas y logros van a aparecer acá. Mientras tanto, así se ve el catálogo completo de logros que puedes ir desbloqueando 👇</div>`;
  return intro + radarCardHtml(playerId) + miPerfilBlockHtml(playerId, agg, computeLeagueTitles(), playerName, 'lo logras', hasData);
}
function renderMiPerfilDoubles(playerId){
  const agg = pairUmpireStats();
  const myPairKeys = Object.keys(agg).filter(k=>k.split('|').includes(playerId));
  if(myPairKeys.length===0){
    return `<div class="empty" style="margin-bottom:14px;">Todavía no tienes partidos de dobles arbitrados con ninguna pareja. Así se ve el catálogo de logros de pareja que pueden ir desbloqueando cuando arbitren juntos 👇</div>`
      + miPerfilBlockHtml('preview|pending', emptyAggShape(), computePairLeagueTitles(), pairLabel, 'lo logran', false);
  }
  const titles = computePairLeagueTitles();
  return myPairKeys.map(key=>`
    <div style="margin-bottom:22px;">
      <div class="section-sub" style="margin:0 0 6px;font-weight:600;color:var(--chalk);">${esc(pairLabel(key))}</div>
      ${miPerfilBlockHtml(key, agg[key], titles, pairLabel, 'lo logran')}
    </div>`).join('');
}
function miPerfilBlockHtml(ownerId, agg, titles, holderLabelFn, verbSuffix, hasData){
  hasData = hasData !== false;
  const totalAch = Object.keys(PROFILE_ACHIEVEMENTS_DEF).length;
  const unlockedKeys = Object.keys(agg.unlocked).filter(k=>agg.unlocked[k]);
  const pct = Math.round((unlockedKeys.length/totalAch)*100);
  const nearest = hasData ? nearestLockedAchievement(agg) : null;
  const recent = hasData && agg.lastMatch ? agg.lastMatch.cur : null;

  const mine = hasData ? titles.filter(t=>t.holderId===ownerId) : [];
  const inDanger = mine.filter(t=>{
    if(t.runnerUpId==null) return false;
    const gap = Math.abs(t.value - t.runnerUpValue);
    const rel = t.value!==0 ? gap/Math.abs(t.value) : 1;
    return rel<=0.15;
  });
  const closeOnes = hasData ? titles.filter(t=>t.holderId!==ownerId && t.runnerUpId===ownerId) : [];
  // Títulos dinámicos (incluido el GOAT) que todavía nadie tiene: se muestran igual,
  // para motivar a perseguirlos aunque nadie los haya conseguido aún.
  const unclaimed = titles.filter(t=>t.holderId===null);

  const achGrid = Object.keys(PROFILE_ACHIEVEMENTS_DEF).map(key=>
    achCardHtml(key, PROFILE_ACHIEVEMENTS_DEF[key], !!agg.unlocked[key], agg.unlockEvents[key], agg, ownerId)
  ).join('');

  return `
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <strong>Logros desbloqueados</strong><span class="tourn-meta">${unlockedKeys.length}/${totalAch} (${pct}%)</span>
      </div>
      <div style="background:var(--court-3);border-radius:8px;height:10px;overflow:hidden;">
        <div style="background:var(--ball);height:100%;width:${pct}%;"></div>
      </div>
      ${nearest ? `<div class="tourn-meta" style="margin-top:8px;">🎯 Casi ${esc(verbSuffix)}: <strong>${esc(nearest.def.t)}</strong> — ${esc(nearest.text)}</div>` : ''}
      ${recent ? `<div class="tourn-meta" style="margin-top:4px;">📍 Última vez arbitrado(a) (${esc(agg.lastMatch.label)}${agg.lastMatch.date?' · '+fmtAchDate(agg.lastMatch.date):''}): ${[recent.point>=2?`🔥 ${recent.point} puntos seguidos`:'', recent.cleanRun>=3?`🧊 ${recent.cleanRun} sin error propio`:''].filter(Boolean).join(' · ') || 'sin rachas destacadas al cierre'}</div>` : ''}
    </div>
    ${inDanger.length ? `<div class="card" style="margin-bottom:14px;border-color:#D8656F;">
      <strong style="color:#D8656F;">⚠️ Títulos en peligro</strong>
      ${inDanger.map(t=>`<div class="tourn-meta" style="margin-top:4px;">${t.e} ${esc(t.t)} — ${esc(holderLabelFn(t.runnerUpId))} está a solo ${esc(t.runnerUpDisplay)} de arrebatártelo (tú: ${esc(t.display)})</div>`).join('')}
    </div>` : ''}
    ${closeOnes.length ? `<div class="card" style="margin-bottom:14px;">
      <strong>🥈 Títulos al alcance</strong>
      ${closeOnes.map(t=>`<div class="tourn-meta" style="margin-top:4px;">${t.e} ${esc(t.t)} — líder actual ${esc(holderLabelFn(t.holderId))}: ${esc(t.display)} · tú: ${esc(t.runnerUpDisplay)}</div>`).join('')}
    </div>` : ''}
    ${unclaimed.length ? `<div class="card" style="margin-bottom:14px;">
      <strong>🐐 Títulos sin dueño — sé el primero</strong>
      ${unclaimed.map(t=>`<div class="tourn-meta" style="margin-top:4px;">${t.e} ${esc(t.t)} — ${esc(t.d)}</div>`).join('')}
    </div>` : ''}
    <div class="grid">${achGrid}</div>
  `;
}

// ---------- Helpers compartidos de la vista de Logros ----------
function achChipsHtml(activeCat){
  const cats = [['all','Todas'],['goat','🐐 GOAT'],['power','Potencia'],['defense','Defensa'],['serve','Servicio'],['shame','Hall of Shame 😅']];
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;">
    ${cats.map(([key,label])=>`<button class="btn btn-sm ${activeCat===key?'btn-primary':'btn-ghost'}" onclick="AceApp.setAchCategory('${key}')">${label}</button>`).join('')}
  </div>`;
}
function achSearchHtml(value, placeholder){
  return `<input type="text" placeholder="${esc(placeholder||'Buscar…')}" value="${esc(value)}" oninput="AceApp.setAchSearch(this.value)" style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--court-3);color:var(--chalk);margin-bottom:12px;font-family:'Work Sans',sans-serif;">`;
}

function titleThreatLine(t, holderLabelFn){
  if(t.runnerUpId==null) return '';
  const gap = Math.abs(t.value - t.runnerUpValue);
  const rel = t.value!==0 ? gap/Math.abs(t.value) : 1;
  if(rel > 0.3) return '';
  const danger = rel <= 0.15;
  return `<div class="tourn-meta" style="margin-top:4px;${danger?'color:#D8656F;font-weight:600;':''}">${danger?'⚠️ En peligro':'🥈 De cerca'} · ${esc(holderLabelFn(t.runnerUpId))}: ${esc(t.runnerUpDisplay)}</div>`;
}

function umpiredTitlesSectionHtml(umpiredCount){
  if(umpiredCount===0){
    return `<div class="empty">Todavía no hay partidos de singles arbitrados en vivo con estadísticas. Usa "🔴 Arbitrar en vivo" en un partido para empezar a generar títulos.</div>`;
  }
  return titlesGridHtml(computeLeagueTitles(), playerName);
}
function pairTitlesSectionHtml(umpiredCount){
  if(umpiredCount===0){
    return `<div class="empty">Todavía no hay partidos de dobles arbitrados en vivo con estadísticas. Usa "🔴 Arbitrar en vivo" en un partido de dobles para empezar a generar títulos de pareja.</div>`;
  }
  return titlesGridHtml(computePairLeagueTitles(), pairLabel);
}
function titlesGridHtml(titles, holderLabelFn){
  if(titles.length===0){
    return `<div class="empty">Ningún título calza con el filtro elegido.</div>`;
  }
  const catLabel = {goat:'🐐 El GOAT', power:'Potencia y Ataque', defense:'Solidez y Defensa', serve:'Servicio y Quiebres', shame:'Hall of Shame 😅'};
  const order = ['goat','power','defense','serve','shame'];
  const byCat = {};
  titles.forEach(t=>{ (byCat[t.category]=byCat[t.category]||[]).push(t); });
  return order.filter(c=>byCat[c]).map(c=>`
    <div style="margin-bottom:8px;">
      <div class="tourn-meta" style="text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin:10px 0 6px;">${catLabel[c]}</div>
      <div class="grid">
        ${byCat[c].map(t=> t.holderId ? `<div class="card award-card">
          <div class="award-emoji">${t.e}</div>
          <div class="disp award-title">${esc(t.t)}</div>
          <div class="award-who">👑 ${esc(holderLabelFn(t.holderId))}</div>
          <div class="award-desc">${esc(t.d)}</div>
          <div class="tourn-meta" style="margin-top:6px;">Actual: ${esc(t.display)}</div>
          ${titleThreatLine(t, holderLabelFn)}
        </div>` : `<div class="card award-card" style="opacity:0.62;">
          <div class="award-emoji">🔓</div>
          <div class="disp award-title">${esc(t.t)}</div>
          <div class="award-who" style="color:var(--muted);">Nadie lo tiene todavía</div>
          <div class="award-desc">${esc(t.d)}</div>
          <div class="tourn-meta" style="margin-top:6px;">🎯 Cómo conseguirlo: cumple esta condición y el título será tuyo.</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

function entityBadgeCardHtml(headerHtml, a, badges){
  const m = a.max;
  const streakPills = [
    m.point>=2 ? `<span class="stat-pill">🔥 ${m.point} puntos seguidos (mejor racha)</span>` : '',
    m.ace>=2 ? `<span class="stat-pill">⚡ ${m.ace} aces seguidos</span>` : '',
    m.winnerS>=2 ? `<span class="stat-pill">🎯 ${m.winnerS} winners seguidos</span>` : '',
    m.cleanRun>=5 ? `<span class="stat-pill">🧊 ${m.cleanRun} puntos sin error propio</span>` : ''
  ].filter(Boolean).join('');
  const badgeHtml = badges.map(b=>`<span class="stat-pill" title="${esc(b.d)}"><span class="badge-emoji">${b.e}</span> ${esc(b.t)}</span>`).join('');
  return `<div class="card" style="margin-bottom:10px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      ${headerHtml}
      <span class="tourn-meta" style="margin-left:auto;">${a.ace} ace · ${a.winner} winner · ${a.unfError} err. no forz.</span>
    </div>
    <div class="player-badges" style="justify-content:flex-start;">
      ${streakPills || '<span class="tourn-meta">Sin rachas destacadas todavía.</span>'}
    </div>
    ${badgeHtml ? `<div class="player-badges" style="justify-content:flex-start;margin-top:6px;">${badgeHtml}</div>` : ''}
  </div>`;
}

// Tarjeta de UN logro de perfil (bloqueado o desbloqueado) con tier, condición,
// barra de progreso ("casi lo logras"), fecha/partido de desbloqueo y estrella
// de vitrina (item de "mostrar mis logros propios").
function achCardHtml(key, def, unlocked, ev, agg, ownerId){
  const tierColor = {bronze:'#C08552', silver:'#B9C4CA', gold:'#D4AF37'}[def.tier] || 'var(--line)';
  const isPair = ownerId.indexOf('|')>=0;
  const owner = isPair ? null : playerById(ownerId);
  const showcase = owner ? (owner.showcase||[]) : [];
  const isShowcased = showcase.includes('ach:'+key);
  const canShowcase = !isPair && (state.isAdmin || ownerId===state.myPlayerId);
  let progressHtml = '';
  if(!unlocked && def.progress){
    const val = def.progress.get(agg);
    const pct = Math.round((def.progress.isRatio ? Math.min(1,val) : Math.min(1, val/def.progress.target))*100);
    const text = def.progress.fmt(def.progress.isRatio ? agg : val);
    progressHtml = `<div style="background:var(--court-3);border-radius:6px;height:6px;overflow:hidden;margin:8px 0 4px;"><div style="background:${tierColor};height:100%;width:${pct}%;"></div></div><div class="tourn-meta">${esc(text)}</div>`;
  }
  return `<div class="card award-card" style="opacity:${unlocked?1:0.6};border-color:${unlocked?tierColor:'var(--line)'};position:relative;">
    ${canShowcase ? `<button onclick="AceApp.toggleShowcase('${ownerId}','ach:${key}')" title="${isShowcased?'Quitar de tu vitrina':'Destacar en tu vitrina (máx. 3)'}" style="position:absolute;top:6px;right:6px;background:none;border:none;cursor:pointer;font-size:17px;line-height:1;">${isShowcased?'⭐':'☆'}</button>` : ''}
    <div class="award-emoji">${unlocked?def.e:'🔒'}</div>
    <div class="disp award-title">${esc(def.t)}</div>
    <div class="tourn-meta" style="text-transform:uppercase;font-size:10px;letter-spacing:.05em;">${ACH_TIER_LABEL[def.tier]||''}</div>
    <div class="award-desc">${esc(def.d)}</div>
    ${unlocked && ev ? `<div class="tourn-meta" style="margin-top:6px;">✅ Desde: ${esc(ev.label)}${ev.date?' · '+fmtAchDate(ev.date):''}</div>` : ''}
    ${!unlocked ? progressHtml : ''}
  </div>`;
}
// ---------- VIEW: FINANCE ----------
function viewFinance(){
  const recaudado = paidTotal();
  const gastado = expensesTotal();
  const fondo = recaudado - gastado;

  const summary = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:26px;">
      <div class="card">
        <div class="tourn-meta">Recaudado en cuotas</div>
        <div class="disp" style="font-size:26px;color:var(--ball);">${fmtMoney(recaudado)}</div>
      </div>
      <div class="card">
        <div class="tourn-meta">Gastado</div>
        <div class="disp" style="font-size:26px;color:var(--clay-light);">${fmtMoney(gastado)}</div>
      </div>
      <div class="card">
        <div class="tourn-meta">Fondo del circuito</div>
        <div class="disp" style="font-size:26px;color:${fondo>=0?'var(--chalk)':'#E08A6E'};">${fmtMoney(fondo)}</div>
      </div>
    </div>`;

  // Cuotas: individuales
  const singlesRows = state.tournaments.length===0 ? `<div class="empty">Aún no hay torneos individuales.</div>` :
    [...state.tournaments].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>{
      const tier = tierOf(t.tier);
      if(!(t.participants||[]).length){
        return `<div class="card" style="margin-bottom:10px;">
          <div class="tourn-title" style="font-size:18px;">${esc(t.name)} <span class="tier-badge" style="background:${tier.color};font-size:9px;vertical-align:middle;">${tier.short}</span></div>
          <div class="tourn-meta">Todavía no tiene inscritos, no hay cuotas que cobrar aún.</div>
        </div>`;
      }
      const chips = t.participants.map(pid=>{
        const isPaid = (t.paid||[]).includes(pid);
        const click = state.isAdmin ? ` onclick="AceApp.togglePaid('singles','${t.id}','${pid}')"` : ' style="cursor:default;"';
        return `<span class="pay-chip ${isPaid?'paid':'pending'}"${click}>${isPaid?'✅':'🎫'} ${esc(playerName(pid))} ${isPaid?'· pagado':'· '+fmtMoney(tier.fee)}</span>`;
      }).join('');
      const allPaid = t.participants.every(pid=>(t.paid||[]).includes(pid));
      return `<div class="card" style="margin-bottom:10px;">
        <div class="tourn-title" style="font-size:18px;">${esc(t.name)} <span class="tier-badge" style="background:${tier.color};font-size:9px;vertical-align:middle;">${tier.short}</span></div>
        <div class="tourn-meta" style="margin-bottom:8px;">Cuota: ${fmtMoney(tier.fee)} por jugador${state.isAdmin?' · toca un nombre para marcar como pagado':''}</div>
        <div>${chips}</div>
        ${state.isAdmin ? `<div style="margin-top:8px;">
          <button class="btn btn-ghost btn-sm" onclick="AceApp.markAllPaid('singles','${t.id}', ${!allPaid})">${allPaid?'↺ Desmarcar todos':'✅ Marcar todos como pagados'}</button>
        </div>` : ''}
      </div>`;
    }).join('');

  // Cuotas: dobles
  const doublesRows = state.doubles.length===0 ? `<div class="empty">Aún no hay torneos de dobles.</div>` :
    [...state.doubles].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>{
      const tier = tierOf(t.tier);
      if(!(t.pairs||[]).length){
        return `<div class="card" style="margin-bottom:10px;">
          <div class="tourn-title" style="font-size:18px;">${esc(t.name)} <span class="tier-badge" style="background:${tier.color};font-size:9px;vertical-align:middle;">${tier.short}</span></div>
          <div class="tourn-meta">Todavía no tiene parejas armadas, no hay cuotas que cobrar aún.</div>
        </div>`;
      }
      const chips = t.pairs.map((pair,idx)=>{
        const isPaid = (t.paid||[]).includes(String(idx));
        const click = state.isAdmin ? ` onclick="AceApp.togglePaid('doubles','${t.id}','${idx}')"` : ' style="cursor:default;"';
        return `<span class="pay-chip ${isPaid?'paid':'pending'}"${click}>${isPaid?'✅':'🎫'} ${pair.map(playerName).join(' / ')} ${isPaid?'· pagado':'· '+fmtMoney(tier.fee)}</span>`;
      }).join('');
      const allPaid = t.pairs.every((pair,idx)=>(t.paid||[]).includes(String(idx)));
      return `<div class="card" style="margin-bottom:10px;">
        <div class="tourn-title" style="font-size:18px;">${esc(t.name)} <span class="tier-badge" style="background:${tier.color};font-size:9px;vertical-align:middle;">${tier.short}</span></div>
        <div class="tourn-meta" style="margin-bottom:8px;">Cuota: ${fmtMoney(tier.fee)} por pareja${state.isAdmin?' · toca una pareja para marcarla como pagada':''}</div>
        <div>${chips}</div>
        ${state.isAdmin ? `<div style="margin-top:8px;">
          <button class="btn btn-ghost btn-sm" onclick="AceApp.markAllPaid('doubles','${t.id}', ${!allPaid})">${allPaid?'↺ Desmarcar todos':'✅ Marcar todos como pagados'}</button>
        </div>` : ''}
      </div>`;
    }).join('');

  // Gastos
  const expenseRows = state.expenses.length===0 ? `<div class="empty">Sin gastos registrados. Agrega tarros de pelotas, grips, antivibradores, etc.</div>` :
    [...state.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`
      <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <div style="flex:1;">
          <div style="font-weight:700;font-size:14px;">${esc(e.concept)}</div>
          <div class="tourn-meta">${esc(e.category)} ${e.date?'· '+e.date:''}</div>
        </div>
        <div class="disp" style="font-size:18px;color:var(--clay-light);">${fmtMoney(e.amount)}</div>
        ${state.isAdmin?`<button class="btn btn-danger btn-sm" onclick="AceApp.deleteExpense('${e.id}')">✕</button>`:''}
      </div>`).join('');

  return `
    <div class="section-head"><h2>Finanzas</h2></div>
    <div class="section-sub">El fondo del circuito es lo pagado en cuotas menos lo gastado en pelotas y premiación.</div>
    ${summary}
    <h3 style="font-size:18px;margin:6px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Cuotas · Individuales</h3>
    ${singlesRows}
    <h3 style="font-size:18px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Cuotas · Dobles</h3>
    ${doublesRows}
    <div class="section-head" style="margin-top:26px;"><h3 style="font-size:18px;color:var(--chalk);margin:0;">Gastos</h3>${state.isAdmin?`<button class="btn btn-primary btn-sm" onclick="AceApp.openExpenseModal()">+ Nuevo gasto</button>`:''}</div>
    ${expenseRows}`;
}


// ---------- VIEW: HALL OF FAME ----------
function renderTemporadasHallOfFame() {
  const seasons = state.seasons || [];
  if (seasons.length === 0) return '';

  let html = `<div class="card" style="margin-bottom:20px;">
    <h3 style="margin:0 0 12px;color:var(--ball);font-size:18px;">👑 Campeones de Temporada (Semestrales)</h3>
    <div style="display:flex;flex-direction:column;gap:10px;">`;

  seasons.forEach(s => {
    const champ = playerById(s.singlesChampion);
    html += `
      <div style="background:var(--court);padding:12px;border-radius:8px;border:1px solid var(--line);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <strong style="color:var(--chalk);font-size:15px;">${esc(s.name)}</strong>
          <span style="font-size:11px;color:var(--muted);">${s.date}</span>
        </div>
        <div style="font-size:13px;color:var(--ball);">
          🏆 <strong>Campeón Singles:</strong> ${champ ? esc(champ.name) : '—'}
        </div>
      </div>`;
  });

  html += `</div></div>`;
  return html;
}

function viewHallOfFame(){
  const head = `<div class="section-head"><h2>Salón de la fama</h2></div>
  <div class="section-sub">La vitrina de trofeos: campeones de temporada y ganadores de cada torneo del circuito.</div>`;
  
  const temporadasHtml = renderTemporadasHallOfFame();
  const entries = hallOfFameEntries();
  
  if (entries.length === 0 && !temporadasHtml) {
    return head + `<div class="empty"><span class="disp">Todavía no hay campeones</span>En cuanto se cierre el primer torneo o temporada, aparecerá aquí.</div>`;
  }
  
  const cards = entries.map(e => `
    <div class="card" style="display:flex;align-items:center;gap:14px;margin-bottom:10px;">
      <div style="font-size:30px;">${e.type==='doubles'?'👥':'🏆'}</div>

        <div class="tourn-meta">${e.date||'Sin fecha'} · ${e.type==='doubles'?'Dobles':'Individual'}</div>

        ${e.runnerUpLabel?`<div class="tourn-meta">venció a ${esc(e.runnerUpLabel)}</div>`:''}
      </div>

  `).join('');

  return head + temporadasHtml + cards;
}

// ---------- VIEW: STATS ----------
  function getPlayerAttributes(playerId) {
  const mStats = playerMatchStats(playerId);
  const umpStats = (playerUmpireStats && playerUmpireStats()[playerId]) || {};
  
  // 1. Efectividad
  const efectividad = mStats ? (mStats.pct || 40) : 40;

  // 2. Potencia (Aces + Winners por partido)
  const hitsPerMatch = umpStats.matchesUmpired ? ((umpStats.ace || 0) + (umpStats.winner || 0)) / umpStats.matchesUmpired : 0;
  const potencia = Math.min(100, Math.max(20, Math.round(hitsPerMatch * 10) + 30));

  // 3. Control (Bajo nivel de errores)
  const errorRate = umpStats.pointsPlayed ? ((umpStats.unfError || 0) / umpStats.pointsPlayed) : 0.2;
  const control = Math.max(10, Math.round((1 - errorRate) * 100));

  // 4. Experiencia (Partidos jugados en el circuito)
  const experiencia = Math.min(100, Math.max(25, ((mStats ? mStats.played : 0) * 8) + 20));

  // 5. Rendimiento bajo presión
  const presion = Math.min(100, Math.max(30, ((umpStats.breaksAchieved || 0) * 12) + 35));

  return [efectividad, potencia, control, experiencia, presion];
}

// Comparativa "cara a cara" con barras horizontales enfrentadas (estilo videojuego de pelea):
// cada fila mide una métrica (victorias directas, títulos, racha actual) y las barras de
// cada jugador crecen desde el centro hacia su lado, con el valor mostrado en la punta.
function h2hStatBarsHtml(playerA, playerB, rec) {
  if (!playerA || !playerB) return '';

  const titlesMap = titlesByPlayer(state.tournaments, false);
  const titlesA = titlesMap[playerA.id] || 0;
  const titlesB = titlesMap[playerB.id] || 0;

  const streakA = currentStreak(playerA.id);
  const streakB = currentStreak(playerB.id);
  const streakDisp = (s) => s === 0 ? '0' : `${s > 0 ? '🔥' : '📉'}${Math.abs(s)}`;

  const rows = [
    { label: 'Victorias (cara a cara)', valA: rec.winsA, valB: rec.winsB, dispA: rec.winsA, dispB: rec.winsB },
    { label: 'Títulos individuales', valA: titlesA, valB: titlesB, dispA: titlesA, dispB: titlesB },
    { label: 'Racha actual', valA: Math.abs(streakA), valB: Math.abs(streakB), dispA: streakDisp(streakA), dispB: streakDisp(streakB) },
  ];

  const barsHtml = rows.map(r => {
    const max = Math.max(1, r.valA, r.valB);
    const pctA = Math.round((r.valA / max) * 100);
    const pctB = Math.round((r.valB / max) * 100);
    return `
      <div class="h2h-bar-row">
        <div class="h2h-bar-row-label">${esc(r.label)}</div>
        <div class="h2h-bar-outer">
          <div class="h2h-bar-half">
            <div class="h2h-bar-fill a" style="width:${pctA}%;"></div>
            <span class="h2h-bar-val a">${esc(String(r.dispA))}</span>
          </div>
          <div class="h2h-bar-center-line"></div>
          <div class="h2h-bar-half">
            <div class="h2h-bar-fill b" style="width:${pctB}%;"></div>
            <span class="h2h-bar-val b">${esc(String(r.dispB))}</span>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="h2h-compare">
      <div class="h2h-compare-names">
        <span class="h2h-compare-name a">${esc(playerA.name)}</span>
        <span class="h2h-compare-vs">VS</span>
        <span class="h2h-compare-name b">${esc(playerB.name)}</span>
      </div>
      ${barsHtml}
    </div>`;
}
function generateRadarSvg(playerA, playerB) {
  if (!playerA) return '';
  const statsA = getPlayerAttributes(playerA.id);
  const statsB = playerB ? getPlayerAttributes(playerB.id) : null;

  const labels = ['Efectividad', 'Potencia', 'Control', 'Experiencia', 'Presión'];
  const total = labels.length;
  const size = 260;
  const center = size / 2;
  const radius = 80;

  function getCoordinates(index, value) {
    const angle = (Math.PI * 2 / total) * index - Math.PI / 2;
    const r = (value / 100) * radius;
    return {
      x: center + r * Math.cos(angle),
      y: center + r * Math.sin(angle)
    };
  }

  // Anillos de fondo (Red Spiderweb)
  let gridSvg = [0.25, 0.5, 0.75, 1].map(level => {
    const points = labels.map((_, i) => {
      const { x, y } = getCoordinates(i, level * 100);
      return `${x},${y}`;
    }).join(' ');
    return `<polygon points="${points}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');

  // Ejes y Etiquetas
  let axesSvg = labels.map((label, i) => {
    const { x, y } = getCoordinates(i, 100);
    const labelPos = getCoordinates(i, 122);
    return `
      <line x1="${center}" y1="${center}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${labelPos.x}" y="${labelPos.y + 3}" text-anchor="middle" font-size="9" fill="var(--muted)" font-weight="600">${label}</text>
    `;
  }).join('');

  // Polígono Jugador A (Dorado/Pelota)
  const polyA = labels.map((_, i) => {
    const { x, y } = getCoordinates(i, statsA[i]);
    return `${x},${y}`;
  }).join(' ');

  // Polígono Jugador B (Naranja/Rival)
  let polyBSvg = '';
  if (statsB) {
    const polyB = labels.map((_, i) => {
      const { x, y } = getCoordinates(i, statsB[i]);
      return `${x},${y}`;
    }).join(' ');
    polyBSvg = `<polygon points="${polyB}" fill="rgba(224, 138, 110, 0.35)" stroke="#E08A6E" stroke-width="2"/>`;
  }

  // Leyenda de colores: cada jugador queda asociado a un color fijo (A = dorado, B = naranja)
  // para poder distinguir sus polígonos en el pentágono de un vistazo.
  const legendSvg = `
    <div class="radar-legend">
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--chalk);font-weight:600;">
        <span style="width:10px;height:10px;border-radius:50%;background:var(--ball);display:inline-block;"></span>${esc(playerA.name)}
      </span>
      ${playerB ? `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--chalk);font-weight:600;">
        <span style="width:10px;height:10px;border-radius:50%;background:#E08A6E;display:inline-block;"></span>${esc(playerB.name)}
      </span>` : ''}
    </div>`;

  return `
    <div style="text-align:center;margin:10px 0;">
      <svg viewBox="0 0 ${size} ${size}" style="max-width:270px;width:100%;height:auto;overflow:visible;">
        ${gridSvg}
        ${axesSvg}
        <polygon points="${polyA}" fill="rgba(212, 175, 55, 0.4)" stroke="var(--ball)" stroke-width="2"/>
        ${polyBSvg}
      </svg>
      ${legendSvg}
    </div>
  `;
}

function openModal(html){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'ace-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  overlay.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeModal(); return; }
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){
      const primary = overlay.querySelector('.modal-actions .btn-primary, .modal-actions .btn-danger');
      if(primary){ e.preventDefault(); primary.click(); }
    }
  });
  document.getElementById('ace-app').appendChild(overlay);
  const firstField = overlay.querySelector('input[type=text], input[type=number], input[type=date], textarea, select');
  if(firstField) setTimeout(()=> firstField.focus(), 50);
}
function aceAlert(message){
  const existing = document.getElementById('ace-toast');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'ace-toast';
  toast.className = 'ace-toast';
  toast.textContent = message;
  document.getElementById('ace-app').appendChild(toast);
  setTimeout(()=>{ if(toast.parentNode) toast.remove(); }, 4200);
}
async function withLoading(btn, label, fn){
  if(!btn){ return fn(); }
  const original = btn.innerHTML;
  const wasDisabled = btn.disabled;
  btn.disabled = true;
  btn.innerHTML = `<span class="btn-spinner"></span> ${label}`;
  try {
    return await fn();
  } finally {
    if(btn.isConnected){ btn.disabled = wasDisabled; btn.innerHTML = original; }
  }
}
function confirmDialog(message){
  return new Promise(resolve=>{
    window.__acePendingConfirm = resolve;
    const html = `
      <h2>Confirmar</h2>
      <div class="section-sub" style="white-space:pre-line;">${esc(message)}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="AceApp.__resolveConfirm(false)">Cancelar</button>
        <button class="btn btn-danger" onclick="AceApp.__resolveConfirm(true)">Confirmar</button>
      </div>`;
    openModal(html);
  });
}
function __resolveConfirm(value){
  const resolve = window.__acePendingConfirm;
  window.__acePendingConfirm = null;
  closeModal();
  if(resolve) resolve(value);
}

function downloadBackup(){
  if(!state.isAdmin){ aceAlert('Solo el administrador puede descargar el respaldo.'); return; }
  const backup = {
    app: 'valle-grande-tour',
    version: 1,
    exportedAt: new Date().toISOString(),
    players: state.players,
    tournaments: state.tournaments,
    doubles: state.doubles,
    achievements: state.achievements,
    expenses: state.expenses,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `valle-grande-tour-respaldo-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  const input = document.getElementById('restore-file-input');

async function handleRestoreFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if(typeof data !== 'object' || data===null){ throw new Error('El archivo no tiene el formato esperado.'); }
    const summary = `Jugadores: ${(data.players||[]).length}, Torneos: ${(data.tournaments||[]).length}, Dobles: ${(data.doubles||[]).length}, Logros: ${(data.achievements||[]).length}, Gastos: ${(data.expenses||[]).length}`;
    if(!(await confirmDialog(`Esto reemplaza TODOS los datos actuales por los del respaldo:\n${summary}\n\n¿Continuar? Esta acción no se puede deshacer.`))) return;
    state.players = Array.isArray(data.players) ? data.players : [];
    state.tournaments = Array.isArray(data.tournaments) ? data.tournaments : [];
    state.doubles = Array.isArray(data.doubles) ? data.doubles : [];
    state.achievements = Array.isArray(data.achievements) ? data.achievements : [];
    state.expenses = Array.isArray(data.expenses) ? data.expenses : [];
    await save('players', state.players);
    await save('tournaments', state.tournaments);
    await save('doubles', state.doubles);
    await save('achievements', state.achievements);
    await save('expenses', state.expenses);
    render();
    aceAlert('Respaldo restaurado con éxito.');
  } catch(err){
    console.error('Error restaurando respaldo', err);
    aceAlert('No se pudo restaurar el respaldo: ' + (err && err.message ? err.message : err));
  }
}

      <div class="field"><label>Lado A</label><select id="m-sideA">${opts}</select></div>

    ${setRow(1)}
    ${isBestOf3 ? setRow(2) + setRow(3) : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="AceApp.closeModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="AceApp.saveMatch(this, '${t.id}', ${isDoubles})">Guardar partido</button>
    </div>` : `<div class="modal-actions"><button class="btn btn-ghost" onclick="AceApp.closeModal()">Cerrar</button></div>`;

  const html = `
    <button class="close-x" onclick="AceApp.closeModal()">✕</button>
    <h2>Marcador de partidos</h2>
    <div class="section-sub">${esc(t.name)}</div>
    <div class="podium" style="margin-bottom:16px;">${matchesList}</div>

  openModal(html);
}
async function saveMatch(btn, tid, isDoubles){
  if(!state.isAdmin){ aceAlert('Solo el administrador puede cargar marcadores.'); return; }
  const list = isDoubles ? state.doubles : state.tournaments;
  const t = list.find(x=>x.id===tid);
  const competitors = isDoubles
    ? t.pairs.map((pair,idx)=>({key:String(idx), players: pair}))
    : t.participants.map(pid=>({key:pid, players:[pid]}));
  const keyA = document.getElementById('m-sideA').value;
  const keyB = document.getElementById('m-sideB').value;
  if(keyA===keyB){ aceAlert('Elige dos lados distintos.'); return; }
  const compA = competitors.find(c=>c.key===keyA);
  const compB = competitors.find(c=>c.key===keyB);
  const readSet = (aId,bId)=>{
    const a = document.getElementById(aId).value;
    const b = document.getElementById(bId).value;
    if(a==='' && b==='') return null;
    return [a===''?0:Number(a), b===''?0:Number(b)];
  };
  const rules = matchRulesOf(t);
  const sets = (rules.format==='bestOf3'
    ? [readSet('m-s1a','m-s1b'), readSet('m-s2a','m-s2b'), readSet('m-s3a','m-s3b')]
    : [readSet('m-s1a','m-s1b')]
  ).filter(s=>s!==null);
  if(sets.length===0){ aceAlert('Carga el marcador del partido.'); return; }
  await withLoading(btn, 'Guardando...', async () => {
    t.matches = t.matches || [];
    t.matches.push({ id: uid(), sideA: compA.players, sideB: compB.players, sets });
    await save(isDoubles?'doubles':'tournaments', list);
    render();
    openMatchModal(tid, isDoubles);
  });
  playHitSound();
  aceAlert('✅ Partido guardado');
}
async function deleteMatch(tid, matchId, isDoubles){
  if(!state.isAdmin){ aceAlert('Solo el administrador puede eliminar partidos.'); return; }
  const list = isDoubles ? state.doubles : state.tournaments;
  const t = list.find(x=>x.id===tid);
  t.matches = (t.matches||[]).filter(m=>m.id!==matchId);
  await save(isDoubles?'doubles':'tournaments', list);
  render();
  openMatchModal(tid, isDoubles);
}

function runCasualLiveUmpire(){
  const mode = document.getElementById('cm-mode').value;
  const a1 = document.getElementById('cm-a1').value;
  const b1 = document.getElementById('cm-b1').value;
  let nameA, nameB, participantsA, participantsB;
  if(mode === 'doubles'){
    const a2 = document.getElementById('cm-a2').value;
    const b2 = document.getElementById('cm-b2').value;
    if(!a1 || !a2 || !b1 || !b2 || a1===a2 || b1===b2){ aceAlert('Elige 4 jugadores distintos antes de arbitrar en vivo.'); return; }
    nameA = [a1,a2].map(playerName).join(' / ');
    nameB = [b1,b2].map(playerName).join(' / ');
    participantsA = [a1,a2]; participantsB = [b1,b2];
  } else {
    if(!a1 || !b1 || a1===b1){ aceAlert('Elige 2 jugadores distintos antes de arbitrar en vivo.'); return; }
    nameA = playerName(a1); nameB = playerName(b1);
    participantsA = [a1]; participantsB = [b1];
  }
  const rules = readMatchRulesFields('cm');
  AceApp.startLiveMatch({
    nameA, nameB, rules, participantsA, participantsB,
    source: { type: 'casual' },
    onFinishCallback: function(marcador, estadisticas){
      marcador.forEach((set, index) => {
        const n = index + 1;
        const inputA = document.getElementById('cm-s' + n + 'a');
        const inputB = document.getElementById('cm-s' + n + 'b');
        if (inputA && inputB) { inputA.value = set[0]; inputB.value = set[1]; }
      });
    }
  });
}

async function saveCasualMatch(btn) {
  if (!state.isAdmin) { aceAlert('Solo el administrador puede anotar partidos libres.'); return; }
  const mode = document.getElementById('cm-mode').value;
  const a1 = document.getElementById('cm-a1').value;
  const b1 = document.getElementById('cm-b1').value;
  let sideA = [a1];
  let sideB = [b1];

  if (mode === 'doubles') {
    const a2 = document.getElementById('cm-a2').value;
    const b2 = document.getElementById('cm-b2').value;
    if (a1 === a2 || b1 === b2) { aceAlert('Las parejas deben estar compuestas por jugadores distintos.'); return; }
    sideA.push(a2);
    sideB.push(b2);
  }

  const allPlayers = [...sideA, ...sideB];
  if (new Set(allPlayers).size !== allPlayers.length) {
    aceAlert('Un jugador no puede estar en ambos lados del partido.');
    return;
  }

  const matchRules = readMatchRulesFields('cm');
  const readSet = (aId, bId) => {
    const aEl = document.getElementById(aId), bEl = document.getElementById(bId);
    const a = aEl.value, b = bEl.value;
    if(a==='' && b==='') return null;
    return [a===''?0:Number(a), b===''?0:Number(b)];
  };
  const sets = (matchRules.format === 'bestOf3'
    ? [readSet('cm-s1a','cm-s1b'), readSet('cm-s2a','cm-s2b'), readSet('cm-s3a','cm-s3b')]
    : [readSet('cm-s1a','cm-s1b')]
  ).filter(s => s !== null);
  if(sets.length === 0){ aceAlert('Ingresa el resultado de games (a mano o arbitrando en vivo).'); return; }

  const matchData = {
    id: uid(),
    date: document.getElementById('cm-date').value,
    mode,
    sideA,
    sideB,
    matchRules,
    sets
  };

  const pending = window.AceApp._lastLiveStats;
  if (pending) {
    matchData.liveStats = pending;
    window.AceApp._lastLiveStats = null;
  }

  let ok = false;
  await withLoading(btn, 'Guardando...', async () => {
    state.casualMatches = state.casualMatches || [];
    state.casualMatches.push(matchData);
    ok = await save('casualMatches', state.casualMatches);
    if(ok){ closeModal(); render(); } else { state.casualMatches.pop(); }
  });
  if(ok){ playHitSound(); aceAlert('🎾 ¡Partido guardado y puntos cargados al ranking!'); }
}

// Gráfico de "Momentum": muestra cómo evolucionó la ventaja en games durante el partido.
// Si el partido se arbitró en vivo usa el detalle juego a juego (match.liveStats.gameLog),
// que es lo más fino que hay; si no, usa el resultado de cada set como respaldo (siempre
// disponible). Ideal para detectar de un vistazo si hubo una remontada épica.
function momentumChartSvg(match) {
  let seq = [0];
  let granularityLabel = '';
  let unitLabel = '';
  let comebackThreshold = 2;

  if (match.liveStats && Array.isArray(match.liveStats.pointLog) && match.liveStats.pointLog.length) {
    // Punto a punto: la granularidad más fina, ideal cuando se juega al mejor de
    // pocos games por set (ahí "games" queda demasiado grueso para ver el momentum real).
    let diff = 0;
    match.liveStats.pointLog.forEach(pt => {
      diff += (pt.side === 'A') ? 1 : -1;
      seq.push(diff);
    });
    granularityLabel = 'punto a punto';
    unitLabel = 'puntos';
    comebackThreshold = 5;
  } else if (match.liveStats && Array.isArray(match.liveStats.gameLog) && match.liveStats.gameLog.length) {
    let diff = 0;
    match.liveStats.gameLog.forEach(g => {
      diff += (g.winner === 'A') ? 1 : -1;
      seq.push(diff);
    });
    granularityLabel = 'juego a juego';
    unitLabel = 'games';
    comebackThreshold = 2;
  } else if (Array.isArray(match.sets) && match.sets.length) {
    let diff = 0;
    match.sets.forEach(s => {
      if (!s) return;
      const a = Number(s[0]) || 0, b = Number(s[1]) || 0;
      diff += (a - b);
      seq.push(diff);
    });
    granularityLabel = 'set a set';
    unitLabel = 'games';
    comebackThreshold = 2;
  } else {
    return '';
  }
  if (seq.length < 2) return '';

  const nameA = (match.sideA || []).map(playerName).join(' / ') || 'Lado A';
  const nameB = (match.sideB || []).map(playerName).join(' / ') || 'Lado B';

  const w = 280, h = 110, padX = 14, padY = 16;
  const maxAbs = Math.max(1, ...seq.map(v => Math.abs(v)));
  const n = seq.length;
  const xStep = n > 1 ? (w - padX * 2) / (n - 1) : 0;
  const yMid = h / 2;
  const yScale = (h / 2 - padY) / maxAbs;
  const pts = seq.map((v, i) => [padX + i * xStep, yMid - v * yScale]);
  const linePts = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

  const finalDiff = seq[seq.length - 1];
  // El diferencial acumulado (sobre todo en puntos) no siempre coincide con quién
  // ganó realmente el partido (en tenis no gana quien suma más puntos totales),
  // así que el ganador se determina por sets, y ese es el que se usa para la nota
  // de remontada. El diferencial solo se usa para colorear la línea del gráfico.
  const lineColor = finalDiff > 0 ? 'var(--ball)' : (finalDiff < 0 ? '#E08A6E' : 'var(--muted)');
  const endPt = pts[pts.length - 1];

  let setsA = 0, setsB = 0;
  (match.sets || []).forEach(s => {
    if (!s) return;
    const a = Number(s[0]) || 0, b = Number(s[1]) || 0;
    if (a > b) setsA++; else if (b > a) setsB++;
  });
  const winnerSide = setsA > setsB ? 'A' : (setsB > setsA ? 'B' : (finalDiff > 0 ? 'A' : (finalDiff < 0 ? 'B' : null)));

  // Detecta remontada: el mayor déficit alcanzado durante el partido vs. quién ganó al final.
  const minVal = Math.min(...seq);
  const maxVal = Math.max(...seq);
  let comebackNote = '';
  if (winnerSide === 'A' && minVal <= -comebackThreshold) {
    comebackNote = `🔥 ¡Remontada épica! ${nameA} llegó a estar ${Math.abs(minVal)} ${unitLabel} abajo y se llevó el partido.`;
  } else if (winnerSide === 'B' && maxVal >= comebackThreshold) {
    comebackNote = `🔥 ¡Remontada épica! ${nameB} llegó a estar ${maxVal} ${unitLabel} abajo y se llevó el partido.`;
  }

  return `
    <div style="margin-top:14px;text-align:left;">
      <div class="tourn-meta" style="margin-bottom:4px;">📈 Momentum del partido — ventaja en ${unitLabel} (${granularityLabel})</div>
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;">
        <line x1="${padX}" y1="${yMid}" x2="${w - padX}" y2="${yMid}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>
        <polyline points="${linePts}" fill="none" stroke="${lineColor}" stroke-width="2"/>
        <circle cx="${endPt[0].toFixed(1)}" cy="${endPt[1].toFixed(1)}" r="3.5" fill="${lineColor}"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px;">
        <span>⬆️ ${esc(nameA)}</span><span>${esc(nameB)} ⬇️</span>
      </div>
      ${comebackNote ? `<div class="tourn-meta" style="margin-top:6px;color:var(--ball);font-weight:600;">${esc(comebackNote)}</div>` : ''}
    </div>`;
}

  const results = singlesMatchResultsForPlayer(playerId);

  const streak = currentStreak(playerId);
  const expiring = pointsExpiringSoon(playerId, false);

  // Rival más jugado y set más ajustado, en base a los partidos de torneo con marcador cargado.
  const rivalCount = {};

  allSinglesMatches().forEach(m=>{
    const a = (m.sideA||[])[0], b = (m.sideB||[])[0];

    const rival = a===playerId ? b : a;
    if(rival) rivalCount[rival] = (rivalCount[rival]||0) + 1;

let cropState = null;
function handlePhoto(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){ openCropUI(img); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function openCropUI(img){
  const stage = 220;
  const baseScale = Math.max(stage/img.width, stage/img.height);
  const displayW = img.width*baseScale, displayH = img.height*baseScale;
  cropState = { img, stage, baseScale, zoom: 1, x: (stage-displayW)/2, y: (stage-displayH)/2 };
  const wrap = document.getElementById('photo-crop-wrap');
  wrap.innerHTML = `
    <div class="section-sub" style="margin:8px 0 6px;">Arrastra para mover, usa la barra para acercar/alejar.</div>
    <div id="crop-stage" style="width:${stage}px;height:${stage}px;border-radius:50%;overflow:hidden;position:relative;background:var(--court);cursor:grab;touch-action:none;border:2px solid var(--ball);">
      <img id="crop-img" src="${img.src}" style="position:absolute;left:${cropState.x}px;top:${cropState.y}px;width:${displayW}px;height:${displayH}px;max-width:none;user-select:none;">
    </div>
    <input type="range" id="crop-zoom" min="1" max="3" step="0.05" value="1" style="width:${stage}px;margin-top:8px;" oninput="AceApp.onCropZoom(this.value)">
    <div><button type="button" class="btn btn-ball btn-sm" style="margin-top:8px;" onclick="AceApp.applyCrop()">✅ Usar esta foto</button></div>`;
  setupCropDrag();
}
function clampCrop(){
  const displayW = cropState.img.width*cropState.baseScale*cropState.zoom;
  const displayH = cropState.img.height*cropState.baseScale*cropState.zoom;
  const minX = cropState.stage - displayW, minY = cropState.stage - displayH;
  cropState.x = Math.max(minX, Math.min(0, cropState.x));
  cropState.y = Math.max(minY, Math.min(0, cropState.y));
}
function setupCropDrag(){
  const stageEl = document.getElementById('crop-stage');
  const imgEl = document.getElementById('crop-img');
  if(!stageEl || !imgEl) return;
  let dragging=false, startPX=0, startPY=0, startX=0, startY=0;
  const getXY = (e)=> e.touches ? e.touches[0] : e;
  const onDown = (e)=>{
    dragging = true;
    const p = getXY(e);
    startPX=p.clientX; startPY=p.clientY; startX=cropState.x; startY=cropState.y;
    stageEl.style.cursor = 'grabbing';
  };
  const onMove = (e)=>{
    if(!dragging || !cropState || !document.body.contains(stageEl)) return;
    const p = getXY(e);
    cropState.x = startX + (p.clientX-startPX);
    cropState.y = startY + (p.clientY-startPY);
    clampCrop();
    imgEl.style.left = cropState.x+'px';
    imgEl.style.top = cropState.y+'px';
    if(e.cancelable) e.preventDefault();
  };
  const onUp = ()=>{ dragging=false; if(stageEl.isConnected) stageEl.style.cursor='grab'; };
  stageEl.addEventListener('mousedown', onDown);
  stageEl.addEventListener('touchstart', onDown, {passive:true});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}
function onCropZoom(val){
  if(!cropState) return;
  cropState.zoom = Number(val);
  clampCrop();
  const imgEl = document.getElementById('crop-img');
  if(imgEl){
    imgEl.style.width = (cropState.img.width*cropState.baseScale*cropState.zoom)+'px';
    imgEl.style.height = (cropState.img.height*cropState.baseScale*cropState.zoom)+'px';
    imgEl.style.left = cropState.x+'px';
    imgEl.style.top = cropState.y+'px';
  }
}
function applyCrop(){
  if(!cropState) return;
  const { img, stage, baseScale, zoom, x, y } = cropState;
  const displayScale = baseScale*zoom;
  const sourceSize = stage/displayScale;
  const sourceX = -x/displayScale, sourceY = -y/displayScale;
  const canvas = document.createElement('canvas');
  canvas.width = 260; canvas.height = 260;
  canvas.getContext('2d').drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, 260, 260);
  tempPhoto = canvas.toDataURL('image/jpeg', 0.85);
  document.getElementById('photo-preview').innerHTML = `<img class="avatar" style="width:64px;height:64px" src="${tempPhoto}">`;
  document.getElementById('photo-crop-wrap').innerHTML = '';
  cropState = null;
}

async function drawBracket(tid, isDoubles){
  if(!state.isAdmin){ aceAlert('Solo el administrador puede sortear el cuadro.'); return; }
  const list = isDoubles ? state.doubles : state.tournaments;
  const t = list.find(x=>x.id===tid);
  if(!t) return;

  const items = isDoubles ? t.pairs.map((_,idx)=>String(idx)) : [...t.participants];
  if(items.length < 2){ aceAlert('Necesitas al menos 2 inscritos para sortear.'); return; }
  if(t.bracket && t.bracket.length > 0 && !(await confirmDialog('Ya hay un cuadro sorteado. ¿Sortear de nuevo? (Se perderán los avances)'))) return;

  const shuffled = shuffleArray(items);
  const numPlayers = shuffled.length;
  // Calcula el tamaño del cuadro (2, 4, 8, 16...)
  const bracketSize = Math.pow(2, Math.ceil(Math.log2(numPlayers))); 
  const numMatchesR1 = bracketSize / 2;

  // 1. Crear Ronda 0 (Primera ronda)
  let round0 = [];
  for(let i=0; i<numMatchesR1; i++) {
    round0.push({ p1: null, p2: null, winner: null, scoreLine: '' });
  }

  // Repartir jugadores intercalados. Los que no tengan rival recibirán un BYE.
  for(let i=0; i<numPlayers; i++) {
    let matchIdx = i % numMatchesR1;
    if(!round0[matchIdx].p1) round0[matchIdx].p1 = shuffled[i];
    else round0[matchIdx].p2 = shuffled[i];
  }

  // Auto-avanzar a los que tienen "Pase Directo" (BYE)
  round0.forEach(m => {
    if(!m.p2) m.winner = m.p1;
  });

  // 2. Crear las siguientes rondas (Semis, Final, etc) vacías
  let rounds = [round0];
  let currentSize = numMatchesR1;
  let rIdx = 1;

  while(currentSize > 1) {
    currentSize = currentSize / 2;
    let round = [];
    for(let i=0; i<currentSize; i++) {
      const prev1 = rounds[rIdx-1][i*2];
      const prev2 = rounds[rIdx-1][i*2+1];
      round.push({
        p1: prev1.winner || null,
        p2: prev2.winner || null,
        winner: null,
        scoreLine: ''
      });
    }
    rounds.push(round);
    rIdx++;
  }

  t.bracket = rounds;
  await save(isDoubles ? 'doubles' : 'tournaments', list);
  render();
}

// ---------- DESLIZAMIENTO (SWIPE) ENTRE PESTAÑAS EN MÓVILES ----------
function initTabSwipe(){
  const el = document.getElementById('section-content');
  if (!el || el.dataset.swipeInit) return; // evita registrar el listener más de una vez
  el.dataset.swipeInit = '1';

  const MIN_DIST = 55;   // distancia mínima en px para considerarlo un swipe
  const MAX_TIME = 600;  // tiempo máximo en ms para que cuente como swipe (no arrastre lento)
  const MAX_OFFAXIS_RATIO = 0.6; // cuánto se permite de movimiento vertical respecto al horizontal

  let startX = 0, startY = 0, startTime = 0, tracking = false;

  el.addEventListener('touchstart', (e) => {
    // Si el gesto empieza dentro de una zona con su propio scroll horizontal
    // (ej: el árbol de un torneo), no interferimos con ese scroll.
    if (e.target.closest('.bracket-container, .tabs')) { tracking = false; return; }
    if (e.touches.length !== 1) { tracking = false; return; }
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    startTime = Date.now();
    tracking = true;
  }, { passive: true });

  el.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;

    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const elapsed = Date.now() - startTime;

    if (elapsed > MAX_TIME) return;
    if (Math.abs(dx) < MIN_DIST) return;
    if (Math.abs(dy) > Math.abs(dx) * MAX_OFFAXIS_RATIO) return; // gesto demasiado vertical -> era scroll

    const idx = TABS.findIndex(x => x.id === state.tab);
    if (idx === -1) return;

    // Deslizar hacia la derecha (dx > 0) va a la pestaña anterior;
    // deslizar hacia la izquierda (dx < 0) va a la siguiente.
    const newIdx = dx > 0 ? idx - 1 : idx + 1;
    if (newIdx >= 0 && newIdx < TABS.length) {
      setTab(TABS[newIdx].id);
    }
  }, { passive: true });
}

// ---------- SONIDOS DE INTERACCIÓN (golpe de raqueta) ----------
let __aceAudioCtx = null;
function playHitSound(){
  if(state.soundsOn === false) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!__aceAudioCtx) __aceAudioCtx = new Ctx();
    const ctx = __aceAudioCtx;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // Crujido corto de impacto: ruido filtrado con envolvente rápida (tipo "pock" de raqueta)
    const bufferSize = Math.floor(ctx.sampleRate * 0.06);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.setValueAtTime(2200, now);
    bandpass.Q.value = 1.1;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

    noise.connect(bandpass).connect(noiseGain).connect(ctx.destination);

    // Golpe grave breve que da cuerpo al "pock"
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.25, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(oscGain).connect(ctx.destination);

    noise.start(now); noise.stop(now + 0.09);
    osc.start(now); osc.stop(now + 0.1);
  } catch(e){ /* silencioso: si el navegador bloquea audio, no interrumpe el flujo */ }
}
